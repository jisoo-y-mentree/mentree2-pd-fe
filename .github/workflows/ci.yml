name: CI

# 트리거는 pull_request 만 둔다. main 으로의 push 는 PR 경유로만 일어난다.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 훅과 스킬이 조용히 망가지는 것을 막는다.
  # 훅은 사람이 눈으로 확인할 기회가 없으므로 자기검사가 유일한 방어선이다.
  # ---------------------------------------------------------------------------
  checks:
    name: Repo checks (hooks & docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Self-test the git guard
        run: bash .claude/hooks/guard-git.test.sh

      - name: Self-test the PR guard
        run: bash .claude/hooks/guard-pr.test.sh

      - name: Self-test the merge-conflict hook
        run: bash .claude/hooks/check-merge-conflict.test.sh

      - name: Self-test the Korean writing checker
        run: bash .claude/hooks/check-korean.test.sh

      - name: Self-test the docs checker
        run: bash scripts/check-docs.test.sh

      - name: Check docs
        run: python3 scripts/check-docs.py

# -----------------------------------------------------------------------------
# 잡은 checks 하나뿐이다.
#
# 디자인 시스템 잡(lint·typecheck·test·a11y)은 지웠다. 이 리포는 디자인 시스템을
# 구현하지 않으므로 돌릴 것이 없다(docs/adr/0005-design-team-deliverables.md).
# 영구히 건너뛰는 잡을 남기면 가짜 그린이 된다.
#
# 산출물은 마크다운과 정적 HTML 뿐이라 빌드가 없다. 검사할 것은 문서의 정합성이다.
# -----------------------------------------------------------------------------
