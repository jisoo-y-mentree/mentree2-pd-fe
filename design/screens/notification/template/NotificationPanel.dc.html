<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="../../../ds-export/project/tokens/fonts.css">
<link rel="stylesheet" href="../../../ds-export/project/tokens/colors.css">
<link rel="stylesheet" href="../../../ds-export/project/tokens/typography.css">
<link rel="stylesheet" href="../../../ds-export/project/tokens/spacing.css">
<link rel="stylesheet" href="../../../ds-export/project/tokens/icons.css">
<link rel="stylesheet" href="../../../ds-export/project/tokens/base.css">
<link rel="stylesheet" href="../../../ds-export/project/styles.css">
<script src="ds-asset-path.js"></script>
<script src="../../../ds-export/project/_ds_bundle.js"></script>
<link rel="stylesheet" href="notification.css">
<style>a{color:var(--primary)}a:hover{color:var(--green-800)}</style>
</helmet>
<section class="nt-compact" role="dialog" aria-label="알림 내역" data-screen-label="간략형" style="display:flex;flex-direction:column;width:416px;max-width:calc(100vw - 16px);flex:0 1 auto;min-height:0;background:var(--card);color:var(--foreground);font-family:var(--font-sans)">
  <header style="display:flex;align-items:center;gap:8px;padding:12px 12px 12px 20px;border-bottom:1px solid var(--border);flex:0 0 auto">
    <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Icon" name="notification-01" size="{{ 20 }}" hint-size="20px,20px"></x-import>
    <h2 style="margin:0;font-size:var(--text-h3);line-height:var(--text-h3--line-height);letter-spacing:var(--text-h3--letter-spacing);font-weight:600">알림 내역</h2>
    <sc-if value="{{ hasUnread }}" hint-placeholder-val="{{ true }}">
      <span class="tabular" style="font-size:var(--text-micro);line-height:var(--text-h3--line-height);letter-spacing:var(--text-micro--letter-spacing);font-weight:600;color:var(--primary)">{{ unreadCount }}</span>
    </sc-if>
    <span style="flex:1 1 auto"></span>
    <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.IconButton" icon="cancel-01" variant="ghost" size="sm" aria-label="닫기" onClick="{{ onClose }}" hint-size="32px,32px"></x-import>
  </header>
  <sc-if value="{{ showDivider }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 20px 0;flex:0 0 auto">
      <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Button" variant="ghost" size="sm" tone="{{ newTone }}" aria-pressed="{{ onlyUnread }}" dc-props="{{ newBtn }}" onClick="{{ toggleUnread }}" hint-size="auto,32px">새로운 알림</x-import>
      <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Button" variant="ghost" size="sm" disabled="{{ noUnread }}" dc-props="{{ mutedBtn }}" onClick="{{ onReadAll }}" hint-size="auto,32px">모두 읽음</x-import>
    </div>
  </sc-if>
  <div style="flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:thin;padding:8px 20px 12px;display:flex;flex-direction:column;gap:10px">
    <sc-if value="{{ isList }}" hint-placeholder-val="{{ true }}">
      <div class="nt-list">
        <sc-for list="{{ cards }}" as="c" hint-placeholder-count="3">
          <div class="nt-swipe">
            <sc-if value="{{ c.swiping }}" hint-placeholder-val="{{ false }}"><div class="nt-swipe-bg" aria-hidden="true">삭제</div></sc-if>
            <article class="{{ c.cls }}" data-temp="DS-117" style="{{ c.swipeStyle }}" onPointerDown="{{ c.onDown }}" onPointerMove="{{ c.onMove }}" onPointerUp="{{ c.onUp }}" onPointerCancel="{{ c.onUp }}">
              <span class="nt-lead">
                <sc-if value="{{ c.isL1 }}" hint-placeholder-val="{{ true }}"><span class="nt-dot" aria-hidden="true"></span></sc-if>
                <sc-if value="{{ c.hasIcon }}" hint-placeholder-val="{{ false }}"><span class="nt-icon"><x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Icon" name="{{ c.icon }}" size="{{ c.iconSize }}" hint-size="24px,24px"></x-import></span></sc-if>
              </span>
              <p class="nt-text"><span class="nt-sr">{{ c.srPrefix }}</span>{{ c.text }}</p>
              <div class="nt-meta">
                <sc-if value="{{ c.hasTime }}" hint-placeholder-val="{{ true }}"><span>{{ c.time }}</span></sc-if>
                <sc-if value="{{ c.hasDeadline }}" hint-placeholder-val="{{ false }}"><span class="nt-deadline">{{ c.deadline }}</span></sc-if>
                <sc-if value="{{ c.hasGroup }}" hint-placeholder-val="{{ false }}">
                  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.AvatarGroup" items="{{ c.avatars }}" max="{{ 3 }}" size="xs" hint-size="52px,20px"></x-import>
                  <span class="nt-more">{{ c.more }}</span>
                </sc-if>
              </div>
              <div class="nt-action">
                <sc-if value="{{ c.isL1 }}" hint-placeholder-val="{{ true }}"><a class="nt-link" href="{{ c.href }}" onClick="{{ c.onAction }}">{{ c.actionLabel }}<x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Icon" class="nt-link-ico" name="{{ c.linkIcon }}" size="{{ c.linkIconSize }}" hint-size="16px,16px"></x-import></a></sc-if>
                <sc-if value="{{ c.notL1 }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Button" variant="outline" size="{{ c.btnSize }}" onClick="{{ c.onAction }}" hint-size="auto,32px">{{ c.actionLabel }}</x-import></sc-if>
              </div>
              <sc-if value="{{ c.canDelete }}" hint-placeholder-val="{{ false }}">
                <span class="nt-del"><x-import component-from-global-scope="MentreeDesignSystem_2f86cf.IconButton" icon="cancel-01" variant="ghost" size="sm" aria-label="알림 삭제" onClick="{{ c.onDelete }}" hint-size="32px,32px"></x-import></span>
              </sc-if>
            </article>
          </div>
        </sc-for>
      </div>
      <sc-if value="{{ hasBanner }}" hint-placeholder-val="{{ false }}">
        <div class="nt-banner">
          <a class="nt-banner-link" href="{{ banner.href }}" aria-label="{{ banner.title }}" onClick="{{ onBannerClick }}"></a>
          <span class="nt-banner-icon"><x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Icon" name="rocket-01" size="{{ 24 }}" hint-size="24px,24px"></x-import></span>
          <span class="nt-banner-copy"><span class="nt-banner-label">{{ banner.label }}</span><span class="nt-banner-title">{{ banner.title }}</span></span>
          <span class="nt-banner-close"><x-import component-from-global-scope="MentreeDesignSystem_2f86cf.IconButton" icon="cancel-01" variant="ghost" size="sm" aria-label="닫기" onClick="{{ onDismissBanner }}" hint-size="32px,32px"></x-import></span>
        </div>
      </sc-if>
    </sc-if>
    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
      <div style="min-height:280px;display:flex;align-items:center;justify-content:center">
        <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.EmptyState" size="sm" icon="package-open" title="새 알림이 없습니다" description="질문에 답변이 달리거나 세션이 잡히면 여기에서 알려드립니다." hint-size="100%,120px"></x-import>
      </div>
    </sc-if>
    <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}">
      <div class="nt-list" aria-busy="true">
        <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Skeleton" height="{{ 88 }}" radius="md" hint-size="100%,88px"></x-import>
        <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Skeleton" height="{{ 88 }}" radius="md" hint-size="100%,88px"></x-import>
        <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Skeleton" height="{{ 88 }}" radius="md" hint-size="100%,88px"></x-import>
      </div>
    </sc-if>
    <sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}">
      <div style="min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
        <p style="margin:0;font-size:var(--text-body);line-height:var(--text-body--line-height);letter-spacing:var(--text-body--letter-spacing);color:var(--foreground)">알림을 불러오지 못했어요</p>
        <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Button" variant="outline" size="sm" onClick="{{ onRetry }}" hint-size="auto,32px">다시 시도</x-import>
      </div>
    </sc-if>
  </div>
  <footer style="display:flex;align-items:center;justify-content:center;gap:16px;height:48px;border-top:1px solid var(--border);flex:0 0 auto">
    <a class="nt-foot-link" href="{{ pageHref }}">전체보기</a>
    <span aria-hidden="true" style="width:1px;height:16px;background:var(--border)"></span>
    <a class="nt-foot-link" href="#" title="계정 설정 탭 · 미착수" onClick="{{ stay }}">알림 설정</a>
  </footer>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:640},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;mentee&quot;,&quot;mentor&quot;],&quot;default&quot;:&quot;mentee&quot;,&quot;tsType&quot;:&quot;\&quot;mentee\&quot; | \&quot;mentor\&quot;&quot;},&quot;uiState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;read&quot;,&quot;empty&quot;,&quot;loading&quot;,&quot;error&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;\&quot;normal\&quot; | \&quot;read\&quot; | \&quot;empty\&quot; | \&quot;loading\&quot; | \&quot;error\&quot;&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;NotificationItem[]&quot;},&quot;banner&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;{ label: string; title: string; href: string } | null&quot;},&quot;unreadCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:5,&quot;min&quot;:0,&quot;max&quot;:99,&quot;tsType&quot;:&quot;number&quot;},&quot;pageHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;?screen=page&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onRead&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;(id: string) =&gt; void&quot;},&quot;onDelete&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;(id: string) =&gt; void&quot;},&quot;onReadAll&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onDismissBanner&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onRetry&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { swipe: { id: null, dx: 0, moved: false }, onlyUnread: false };
  componentDidMount() {
    import(new URL("./notification-data.js", document.baseURI).href).then((m) => {
      this.mod = m;
      this.swipeFor = m.makeSwipe(this, (id) => this.props.onDelete && this.props.onDelete(id));
      this.forceUpdate();
    });
  }
  renderVals() {
    const p = this.props;
    const st = p.uiState ?? "normal";
    const all = p.items ?? [];
    const unread = p.unreadCount ?? all.filter((i) => !i.read).length;
    // 안 읽은 것이 하나도 없으면 필터를 풀어 둔다 — 「모두 읽음」 뒤에 토글만 남고 카드가 사라지는 일이 없게
    const onlyUnread = this.state.onlyUnread && unread > 0;
    const items = (onlyUnread ? all.filter((i) => !i.read) : all).slice(0, 5); // 최대 5장 — 6건째부터는 「전체보기」
    const listState = st === "normal" || st === "read" || st === "end";
    const isList = listState && all.length > 0;
    const isEmpty = st === "empty" || (listState && all.length === 0);
    const cards = this.mod
      ? this.mod.cardViewModels(items, { onRead: p.onRead, onDelete: p.onDelete, afterAction: p.onClose, swipe: this.state.swipe, swipeHandlers: this.swipeFor, wide: false })
      : [];
    const banner = p.banner || null;
    return {
      cards,
      unreadCount: unread,
      hasUnread: unread > 0,
      noUnread: unread === 0,
      showDivider: isList || st === "loading",
      isList, isEmpty,
      isLoading: st === "loading",
      isError: st === "error",
      hasBanner: isList && !!banner,
      banner: banner || { href: "#", title: "", label: "" },
      mutedBtn: { style: { color: "var(--muted-foreground)" } },
      onlyUnread,
      newTone: "primary", // 늘 초록 글자 — 켜짐은 aria-pressed · 밑줄로
      newBtn: onlyUnread ? { style: { textDecoration: "underline", textUnderlineOffset: "3px" } } : {},
      toggleUnread: () => this.setState((s) => ({ onlyUnread: !s.onlyUnread })),
      onClose: () => p.onClose && p.onClose(),
      onReadAll: () => { this.setState({ onlyUnread: false }); p.onReadAll && p.onReadAll(); },
      onRetry: () => p.onRetry && p.onRetry(),
      onDismissBanner: () => p.onDismissBanner && p.onDismissBanner(),
      onBannerClick: (e) => { if (!banner || banner.href === "#") e.preventDefault(); },
      pageHref: p.pageHref ?? "?screen=page",
      stay: (e) => e.preventDefault(), // 「알림 설정」 — 마이페이지 계정 설정 탭 미착수(href="#")
    };
  }
}
</script>
</body>
</html>
