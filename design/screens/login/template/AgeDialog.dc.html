<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../../../ds-export/project/styles.css">
  <script src="ds-asset-path.js"></script>
<script src="../../../ds-export/project/_ds_bundle.js"></script>
</helmet>
<x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Dialog" open="{{ open }}" on-close="{{ close }}" title="만 14세 이상이신가요?" width="{{ 520 }}" footer-layout="stack" mobile="fullscreen" footer="{{ footer }}" hint-size="0,0">
  <sc-if value="{{ asking }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-direction:column;gap:20px">
      <p style="margin:0;font-size:var(--text-body);line-height:var(--text-body--line-height);color:var(--foreground)">개인정보 처리 방침으로 인해 만 14세 미만이신 분은 서비스를 이용하실 수 없습니다. 연령 확인 후 로그인이 가능합니다. 확인은 최초 한 번만 진행됩니다.</p>
      <a href="#" style="align-self:flex-start;text-decoration:none">
        <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Button" variant="ghost" size="sm" icon-left="help-circle" hint-size="auto,32px">개인정보 처리 방침</x-import>
      </a>
      <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.RadioGroup" options="{{ options }}" value="{{ answer }}" on-change="{{ setAnswer }}" hint-size="100%,58px"></x-import>
    </div>
  </sc-if>
  <sc-if value="{{ denied }}" hint-placeholder-val="{{ false }}">
    <p style="margin:0;font-size:var(--text-body);line-height:var(--text-body--line-height);color:var(--foreground)">만 14세 미만은 멘트리를 이용할 수 없습니다. 보호자와 함께 다시 방문해주세요.</p>
  </sc-if>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:480},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;phase&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;ask&quot;,&quot;options&quot;:[&quot;ask&quot;,&quot;no&quot;],&quot;tsType&quot;:&quot;'ask' | 'no'&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onConfirm&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(answer: 'yes' | 'no') =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { answer: null };
  componentDidUpdate(prev) { if (prev.open && !this.props.open) this.setState({ answer: null }); }
  renderVals() {
    const p = this.props;
    const phase = p.phase || "ask";
    const asking = phase === "ask";
    const a = this.state.answer;
    const DS = window.MentreeDesignSystem_2f86cf || {};
    const close = () => p.onClose && p.onClose();
    let footer = null;
    if (DS.Button) {
      footer = asking
        ? React.createElement(DS.Button, { variant: "primary", size: "lg", fullWidth: true, disabled: !a, onClick: () => p.onConfirm && p.onConfirm(a) }, a ? "확인" : "연령 확인 버튼을 선택해주세요")
        : React.createElement(DS.Button, { variant: "outline", size: "lg", fullWidth: true, onClick: close }, "닫기");
    }
    return {
      open: !!p.open, asking, denied: !asking, close, footer,
      options: [{ value: "yes", label: "예. 만 14세 이상입니다." }, { value: "no", label: "아니오. 만 14세 미만입니다." }],
      answer: a,
      setAnswer: (v) => this.setState({ answer: v }),
    };
  }
}
</script>
</body>
</html>
