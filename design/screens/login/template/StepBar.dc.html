<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../../../ds-export/project/styles.css">
  <script src="ds-asset-path.js"></script>
<script src="../../../ds-export/project/_ds_bundle.js"></script>
  <style>
    .au-stepbar{display:flex;gap:8px;width:100%;max-width:400px;margin:0 auto}
    .au-stepbar > span{flex:1 1 0;height:6px;border-radius:999px;background:var(--sage-200)}
    .au-stepbar > span.au-on{background:var(--primary)}
  </style>
</helmet>
<div class="au-stepbar" data-temp="DS-121" role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="{{ step }}" aria-label="가입 진행 단계">
  <span class="{{ c1 }}"></span><span class="{{ c2 }}"></span><span class="{{ c3 }}"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:40},&quot;step&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;max&quot;:3,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = Number(this.props.step ?? 1);
    return { step: s, c1: s >= 1 ? "au-on" : "", c2: s >= 2 ? "au-on" : "", c3: s >= 3 ? "au-on" : "" };
  }
}
</script>
</body>
</html>
