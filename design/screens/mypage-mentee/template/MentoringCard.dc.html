<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../../../ds-export/project/tokens/fonts.css">
  <link rel="stylesheet" href="../../../ds-export/project/tokens/colors.css">
  <link rel="stylesheet" href="../../../ds-export/project/tokens/typography.css">
  <link rel="stylesheet" href="../../../ds-export/project/tokens/spacing.css">
  <link rel="stylesheet" href="../../../ds-export/project/tokens/icons.css">
  <link rel="stylesheet" href="../../../ds-export/project/tokens/base.css">
  <link rel="stylesheet" href="../../../ds-export/project/styles.css">
  <script src="ds-asset-path.js"></script>
<script src="../../../ds-export/project/_ds_bundle.js"></script>
  <style>
    /* DS-18 멘토링 카드 — 부품에 없는 조립. 토큰만 참조한다. 768 이하: 「자세히 보기」 줄바꿈 · 버튼 세로 100%. */
    .mp-mentoring-card{display:flex;flex-direction:column;gap:16px;box-sizing:border-box;padding:24px;background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-sm);transition:box-shadow 150ms ease}
    .mp-mentoring-card:hover{box-shadow:var(--shadow-md)}
    .mp-mc-badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .mp-mc-detail{margin-left:auto}
    .mp-mc-status{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .mp-mc-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    @media (max-width:768px){
      .mp-mentoring-card{padding:20px}
      .mp-mc-detail{margin-left:0;flex-basis:100%}
      .mp-mc-status{flex-direction:column;align-items:stretch}
      .mp-mc-actions{flex-direction:column;align-items:stretch;width:100%}
      .mp-mc-actions > *{width:100%}
      .mp-mc-actions button{width:100%}
    }
  </style>
</helmet>
<article class="mp-mentoring-card" data-temp="DS-18" data-status="{{ status }}">
  <div class="mp-mc-badges">
    <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Badge" leading="flag" flag="{{ card.flag }}" size="md" hint-size="auto,28px">{{ card.countryLabel }}</x-import>
    <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Badge" size="md" hint-size="auto,28px">{{ card.keyword }}</x-import>
    <sc-if value="{{ isApplied }}" hint-placeholder-val="{{ true }}">
      <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Badge" variant="accent" size="md" hint-size="auto,28px">{{ statusLabel }}</x-import>
    </sc-if>
    <sc-if value="{{ isScheduling }}" hint-placeholder-val="{{ false }}">
      <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Badge" variant="status" status="active" size="md" hint-size="auto,28px">{{ statusLabel }}</x-import>
    </sc-if>
    <sc-if value="{{ isFixed }}" hint-placeholder-val="{{ false }}">
      <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Badge" variant="tag" hue="sky" size="md" hint-size="auto,28px">{{ statusLabel }}</x-import>
    </sc-if>
    <sc-if value="{{ isNeutral }}" hint-placeholder-val="{{ false }}">
      <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Badge" size="md" hint-size="auto,28px">{{ statusLabel }}</x-import>
    </sc-if>
    <div class="mp-mc-detail">
      <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Button" variant="ghost" size="sm" iconRight="arrow-right-01" onClick="{{ openDetail }}" hint-size="auto,32px">자세히 보기</x-import>
    </div>
  </div>
  <h3 style="margin:0; font-size:var(--text-h3); line-height:var(--text-h3--line-height); letter-spacing:var(--text-h3--letter-spacing); font-weight:600; color:var(--foreground); white-space:nowrap; overflow:hidden; text-overflow:ellipsis">Q. {{ card.title }}</h3>
  <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap; font-size:var(--text-caption); line-height:var(--text-caption--line-height); letter-spacing:var(--text-caption--letter-spacing); font-weight:500; color:var(--muted-foreground)">
    <sc-if value="{{ metaMuted }}" hint-placeholder-val="{{ true }}">
      <span>{{ metaLabel }} : <span class="tabular">{{ metaValue }}</span></span>
    </sc-if>
    <sc-if value="{{ isFixed }}" hint-placeholder-val="{{ false }}">
      <span style="color:var(--primary); font-weight:600">멘토링 예정일 : <span class="tabular">{{ card.scheduledAt }}</span></span>
    </sc-if>
    <span style="display:inline-flex; align-items:center; gap:4px">
      <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Icon" name="flower" size="{{ 16 }}" color="var(--primary)" hint-size="16px,16px"></x-import>
      <span class="tabular">{{ flowersLabel }}</span>
    </span>
  </div>
  <p style="margin:0; font-size:var(--text-body-sm); line-height:var(--text-body-sm--line-height); color:var(--muted-foreground); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden">{{ card.request }}</p>
  <dc-import name="PersonCard" person="{{ card.person }}" href="{{ personHref }}" hint-size="320px,82px"></dc-import>
  <div class="mp-mc-status">
    <div style="font-size:var(--text-body); line-height:var(--text-body--line-height); font-weight:600; color:var(--primary); flex:1; min-width:200px">{{ statusText }}</div>
    <div class="mp-mc-actions">
      <sc-for list="{{ actions }}" as="a" hint-placeholder-count="1">
        <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Button" variant="{{ a.variant }}" tone="{{ a.tone }}" size="md" disabled="{{ a.disabled }}" onClick="{{ a.onClick }}" hint-size="auto,40px">{{ a.label }}</x-import>
      </sc-for>
    </div>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:420},&quot;card&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;id&quot;:&quot;m1&quot;,&quot;status&quot;:&quot;scheduling-received&quot;,&quot;title&quot;:&quot;일본 디자이너 면접과 포트폴리오 리뷰 요청드립니다.&quot;,&quot;flag&quot;:&quot;japan&quot;,&quot;countryLabel&quot;:&quot;일본&quot;,&quot;keyword&quot;:&quot;해외취업&quot;,&quot;appliedDate&quot;:&quot;2026.06.03&quot;,&quot;flowers&quot;:4,&quot;request&quot;:&quot;안녕하세요. 저는 서울의 모 대학교에서 디자인을 공부중인 학생입니다. 내년 봄 도쿄의 디자인 에이전시 신입 공채에 지원하려고 하는데, 포트폴리오 구성과 일본어 면접 준비 방향을 함께 봐주셨으면 합니다.&quot;,&quot;person&quot;:{&quot;name&quot;:&quot;이서연&quot;,&quot;org&quot;:&quot;라쿠텐&quot;,&quot;title&quot;:&quot;프로덕트 디자이너&quot;,&quot;avatar&quot;:&quot;../../../ds-export/project/assets/img/9.png&quot;}},&quot;tsType&quot;:&quot;MentoringCardData&quot;},&quot;perspective&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;mentee&quot;,&quot;options&quot;:[&quot;mentee&quot;,&quot;mentor&quot;],&quot;tsType&quot;:&quot;'mentee' | 'mentor'&quot;},&quot;onDetail&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;(card, modalKey: string) =&gt; void&quot;},&quot;onAction&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;(key: string, card) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const card = this.props.card || {};
    const p = this.props.perspective === "mentor" ? "mentor" : "mentee";
    const st = card.status || "applied";
    const onAction = (key) => () => this.props.onAction && this.props.onAction(key, card);
    const join = () => { if (card.meetingUrl) window.open(card.meetingUrl, "_blank", "noopener"); };
    // A0 — 일람의 초록=primary(한 줄에 둘이면 할 일만 primary · 다른 쪽 outline tone="primary") · 흰=outline · 회색=secondary disabled
    const A = (label, variant, onClick, extra) => ({ label, variant, tone: "neutral", disabled: false, onClick, ...(extra || {}) });
    const cancel = A("멘토링 취소하기", "outline", onAction("cancel-1"));
    const adjusting = A("일정 조정중", "secondary", () => {}, { disabled: true });
    const joinBtn = A("멘토링 참가하기", "primary", join);
    const done = st === "done" || st === "done-reviewed", reviewed = st === "done-reviewed";
    const scheduled = card.scheduledAt || "";
    const cancelText = { me: "나의 요청에 의해 취소되었습니다.", other: p === "mentee" ? "멘토의 사정에 의해 취소되었습니다." : "멘티의 사정에 의해 취소되었습니다.", noshow: "멘토링이 예정대로 실행되지 않아서 취소되었습니다." }[card.cancelReason || "me"];
    let statusText = "", actions = [], statusLabel = "";
    if (p === "mentee") {
      if (st === "applied") { statusLabel = "신청중"; statusText = "멘토의 수락을 기다리는 중입니다."; actions = [cancel]; }
      else if (st === "scheduling-received") { statusLabel = "일정 조율중"; statusText = card.reproposed ? "멘토가 새 일정을 제시했습니다. 일정을 확정해주세요." : "멘토가 멘토링을 수락했습니다. 일정을 확정해주세요."; actions = [A("일정 확정하기", "outline", onAction("fix-schedule")), cancel]; }
      else if (st === "scheduling-sent") { statusLabel = "일정 조율중"; statusText = "멘토에게 일정 재조정을 요청했습니다."; actions = [adjusting, cancel]; }
      else if (st === "fixed") { statusLabel = "멘토링 확정됨"; statusText = `멘토링이 확정되었습니다. ${scheduled}에 멘토링이 진행됩니다.`; actions = [joinBtn, cancel]; }
      else if (st === "done") { statusLabel = "멘토링 완료"; statusText = "멘토링이 완료되었습니다. 리뷰를 작성해주세요."; actions = [card.cheerSent && A("격려 메세지 보기", "outline", onAction("cheer-read"), { tone: "primary" }), A("리뷰 작성하기", "primary", onAction("review"))]; }
      else if (reviewed) { statusLabel = "멘토링 완료"; statusText = "멘토링이 완료되었습니다."; actions = [card.cheerSent && A("격려 메세지 보기", "primary", onAction("cheer-read")), A("작성한 리뷰 보기", "outline", onAction("my-review"))]; }
      else if (st === "cancelled") { statusLabel = "취소됨"; statusText = cancelText; actions = [card.cancelMessage && A("멘토 메세지 보기", "outline", onAction("mentor-message")), A("다시 신청하기", "primary", () => { window.location.href = card.applyHref || "#"; })]; }
    } else {
      if (st === "applied") { statusLabel = "수락 대기중"; statusText = "멘티로부터 멘토링 신청이 도착했습니다."; actions = [A("멘토링 수락하기", "outline", onAction("accept")), A("사양하기", "outline", onAction("cancel-1"))]; }
      else if (st === "scheduling-sent") { statusLabel = "일정 조율중"; statusText = "멘티에게 일정 조율 요청을 보냈습니다."; actions = [adjusting, cancel]; }
      else if (st === "scheduling-received") { statusLabel = "일정 조율중"; statusText = "멘티로부터 일정 재조정 요청이 도착했습니다."; actions = [A("일정 재조정하기", "outline", onAction("accept")), cancel]; }
      else if (st === "fixed") { statusLabel = "멘토링 확정됨"; statusText = `멘토링이 확정되었습니다. ${scheduled}에 멘토링이 진행됩니다.`; actions = [joinBtn, cancel]; }
      else if (done) {
        statusLabel = "멘토링 완료"; statusText = "멘토링이 완료되었습니다.";
        const noReview = A("아직 작성된 리뷰가 없습니다", "secondary", () => {}, { disabled: true });
        actions = card.cheerSent
          ? [A("작성한 격려 메세지 보기", "outline", onAction("cheer-view")), reviewed ? A("작성된 리뷰 보기", "primary", onAction("mentee-review")) : noReview]
          : [A("격려 메세지 작성하기", "primary", onAction("cheer-write")), reviewed ? A("작성된 리뷰 보기", "outline", onAction("mentee-review"), { tone: "primary" }) : noReview];
      }
      else if (st === "cancelled") { statusLabel = "취소됨"; statusText = cancelText; actions = [card.cancelMessage ? A("작성한 메세지 보기", "outline", onAction("cancel-msg-view")) : A("멘티에게 메세지 보내기", "outline", onAction("cancel-msg-write"))]; }
    }
    // A2 — 메타 줄 날짜: 신청 · 조율=신청일 · 확정=예정일(초록) · 완료=실시일 · 취소=확정까지 갔으면 예정일, 아니면 신청일
    let metaLabel = "멘토링 신청일", metaValue = card.appliedDate || "";
    if (done) { metaLabel = "멘토링 실시일"; metaValue = card.sessionAt || scheduled; }
    else if (st === "cancelled" && scheduled) { metaLabel = "멘토링 예정일"; metaValue = scheduled; }
    const flowers = card.flowers || 0;
    const detailKey = "detail-" + st;
    return {
      status: st,
      isApplied: st === "applied",
      isScheduling: st === "scheduling-sent" || st === "scheduling-received",
      isFixed: st === "fixed",
      isNeutral: done || st === "cancelled",
      metaMuted: st !== "fixed", metaLabel, metaValue,
      statusLabel, statusText, actions: actions.filter(Boolean),
      flowersLabel: `${flowers}송이 (${flowers * 2}만원)`,
      personHref: card.personHref || "#",
      openDetail: () => this.props.onDetail && this.props.onDetail(card, detailKey),
    };
  }
}
</script>
</body>
</html>
