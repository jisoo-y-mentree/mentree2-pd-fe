<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../../../ds-export/project/tokens/fonts.css">
  <link rel="stylesheet" href="../../../ds-export/project/tokens/colors.css">
  <link rel="stylesheet" href="../../../ds-export/project/tokens/typography.css">
  <link rel="stylesheet" href="../../../ds-export/project/tokens/spacing.css">
  <link rel="stylesheet" href="../../../ds-export/project/tokens/icons.css">
  <link rel="stylesheet" href="../../../ds-export/project/tokens/base.css">
  <link rel="stylesheet" href="../../../ds-export/project/styles.css">
  <script src="ds-asset-path.js"></script>
<script src="../../../ds-export/project/_ds_bundle.js"></script>
  <style>
    /* DS-119 사람 미니카드 — 부품에 없는 조립. 토큰만 참조한다. */
    .mp-person-card{display:flex;align-items:center;gap:12px;width:320px;max-width:100%;box-sizing:border-box;padding:12px;background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);text-decoration:none;transition:box-shadow 150ms ease}
    .mp-person-card:hover{box-shadow:var(--shadow-md)}
    .mp-person-card:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
    .mp-person-card[data-fluid="true"]{width:100%}
    @media (max-width:768px){.mp-person-card{width:100%}}
  </style>
</helmet>
<a class="mp-person-card" data-temp="DS-119" data-fluid="{{ fluidValue }}" href="{{ hrefValue }}" onClick="{{ onClick }}">
  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Avatar" src="{{ avatar }}" name="{{ name }}" size="{{ 56 }}" hint-size="56px,56px"></x-import>
  <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:2px">
    <div style="display:flex; align-items:center; gap:6px; min-width:0">
      <span style="font-size:var(--text-body); line-height:var(--text-body--line-height); font-weight:600; color:var(--foreground); white-space:nowrap; overflow:hidden; text-overflow:ellipsis">{{ name }}</span>
      <sc-if value="{{ hasFlag }}" hint-placeholder-val="{{ false }}">
        <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Flag" country="{{ flag }}" label="{{ flagLabel }}" size="sm" hint-size="16px,16px"></x-import>
      </sc-if>
    </div>
    <span style="font-size:var(--text-caption); line-height:var(--text-caption--line-height); letter-spacing:var(--text-caption--letter-spacing); font-weight:500; color:var(--muted-foreground); white-space:nowrap; overflow:hidden; text-overflow:ellipsis">{{ orgLine }}</span>
  </div>
  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Icon" name="arrow-right-01" size="{{ 20 }}" color="var(--muted-foreground)" hint-size="20px,20px"></x-import>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:120},&quot;person&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;name&quot;:&quot;이서연&quot;,&quot;org&quot;:&quot;라쿠텐&quot;,&quot;title&quot;:&quot;프로덕트 디자이너&quot;,&quot;avatar&quot;:&quot;../../../ds-export/project/assets/img/9.png&quot;,&quot;flag&quot;:&quot;japan&quot;,&quot;flagLabel&quot;:&quot;일본&quot;},&quot;tsType&quot;:&quot;{name:string;org?:string;title?:string;avatar?:string;flag?:string;flagLabel?:string}&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fluid&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;(e: MouseEvent) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props.person || {};
    const parts = [p.org, p.title].filter(Boolean);
    return {
      name: p.name || "",
      avatar: p.avatar,
      flag: p.flag,
      flagLabel: p.flagLabel || "",
      hasFlag: !!p.flag,
      orgLine: parts.join(" · "),
      hrefValue: this.props.href ?? "#",
      onClick: this.props.onClick,
      fluidValue: !!this.props.fluid,
    };
  }
}
</script>
</body>
</html>
