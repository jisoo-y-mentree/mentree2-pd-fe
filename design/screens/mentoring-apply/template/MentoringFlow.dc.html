    'fixed-24h': '멘토링 일정이 확정되었습니다. 예정 시간까지 24시간이 남지 않았습니다.',
    'done': '멘토링이 완료되었습니다.',
    'cancelled': '취소된 멘토링입니다.',
  },
  mentor: {
    'applied': '멘티로부터 멘토링 신청이 도착했습니다.',
    'scheduling-sent': '멘티에게 일정을 제안했습니다. 멘티가 일정을 확정할 때까지 기다려주세요.',
    'reschedule-requested': '멘티가 일정 재조정을 요청했습니다. 새로운 일정을 제시해주세요.',
    'rescheduled': '새로운 일정을 보냈습니다. 멘티가 일정을 확정할 때까지 기다려주세요.',
    'fixed': '멘토링 일정이 확정되었습니다.',
    'fixed-24h': '멘토링 일정이 확정되었습니다.',
    'done': '멘토링이 완료되었습니다.',
    'cancelled': '취소된 멘토링입니다.',
  },
};
// 흐름 상태 → MentoringCard(마이페이지) 상태
const MC_STATUS = {
  mentee: { 'applied': 'applied', 'scheduling-received': 'scheduling-received', 'reschedule-requested': 'scheduling-sent', 'rescheduled': 'scheduling-received', 'fixed': 'fixed', 'fixed-24h': 'fixed', 'done': 'done', 'cancelled': 'cancelled' },
  mentor: { 'applied': 'applied', 'scheduling-sent': 'scheduling-sent', 'reschedule-requested': 'scheduling-received', 'rescheduled': 'scheduling-sent', 'fixed': 'fixed', 'done': 'done', 'cancelled': 'cancelled' },
};
function toCard(role, flow) {
  const viewer = PEOPLE[role];
  const other = role === 'mentee' ? PEOPLE.mentor : PEOPLE.mentee;
  const msgs = flow.messages || [];
  const cancelMsg = msgs.find((m) => m.type === 'cancel' || m.type === 'decline');
  const last = msgs[msgs.length - 1];
  const cheer = msgs.find((m) => m.type === 'cheer');
  const reply = msgs.find((m) => m.type === 'cancel-reply');
  const cancelBy = flow.cancelBy || (cancelMsg ? cancelMsg.from : flow.cancelStage === 'declined' ? 'mentor' : role);
  const mentorMsg = reply || (cancelMsg && cancelMsg.from === 'mentor' ? cancelMsg : null);
  let status = MC_STATUS[role][flow.status] || 'applied';
  if (status === 'done' && flow.review) status = 'done-reviewed';
  return {
    id: 'flow', status,
    title: flow.title, flag: other.country, countryLabel: other.countryLabel, keyword: flow.type,
    appliedDate: flow.appliedAt, flowers: flow.flowers, request: flow.detail,
    scheduledAt: flow.fixedSlot ? fmtDot(flow.fixedSlot, viewer.off) : '',
    reproposed: flow.status === 'rescheduled',
    rescheduleByMentor: flow.status === 'rescheduled' && !!last && last.type === 'reschedule-reason' && last.from === 'mentor',
    meetingUrl: flow.link,
    cheerSent: !!cheer, cheerMessage: cheer ? cheer.text : null,
    cancelReason: relBy(cancelBy, role),
    // 멘티: 멘토가 남긴 글(취소 사유 또는 답장) · 멘토: 취소 뒤 멘티에게 보낸 답장
    cancelMessage: role === 'mentee' ? (mentorMsg ? mentorMsg.text : null) : (reply ? reply.text : null),
    review: flow.review || null,
    person: { name: other.name, org: other.org, title: other.title, avatar: other.avatar },
    personHref: '#', applyHref: '?role=mentee&screen=apply-1',
  };
}
// 카드와 같은 상태 문구(상세 대화상자 머리글)
function sentenceFor(role, mc) {
  const st = mc.status;
  const cancelText = { me: '나의 요청에 의해 취소되었습니다.', other: role === 'mentee' ? '멘토의 사정에 의해 취소되었습니다.' : '멘티의 사정에 의해 취소되었습니다.', noshow: '멘토링이 예정대로 실행되지 않아서 취소되었습니다.' }[mc.cancelReason];
  const fixed = `멘토링이 확정되었습니다.\n${mc.scheduledAt}에 멘토링이 진행됩니다.`;
  if (role === 'mentee') return { applied: '멘토의 수락을 기다리는 중입니다.', 'scheduling-received': mc.rescheduleByMentor ? '멘토가 일정 재조정을 요청했습니다.' : mc.reproposed ? '멘토가 새 일정을 제시했습니다. 일정을 확정해주세요.' : '멘토가 멘토링을 수락했습니다. 일정을 확정해주세요.', 'scheduling-sent': '멘토에게 일정 재조정을 요청했습니다.', fixed, done: '멘토링이 완료되었습니다. 리뷰를 작성해주세요.', 'done-reviewed': '멘토링이 완료되었습니다.', cancelled: cancelText }[st] || '';
  return { applied: '멘티로부터 멘토링 신청이 도착했습니다.', 'scheduling-sent': '멘티에게 일정 조율 요청을 보냈습니다.', 'scheduling-received': '멘티로부터 일정 재조정 요청이 도착했습니다.', fixed, done: '멘토링이 완료되었습니다.', 'done-reviewed': '멘토링이 완료되었습니다.', cancelled: cancelText }[st] || '';
}

function normStatus(role, st) {
  if (st === 'rescheduled-by-mentor') return 'rescheduled';
  if (role === 'mentor') { if (st === 'scheduling-received') return 'scheduling-sent'; if (st === 'fixed-24h') return 'fixed'; }
  else if (st === 'scheduling-sent') return 'scheduling-received';
  return st;
}
function validFor(role, screen, st) {
  if (screen === 'card' || screen === 'detail' || screen.indexOf('apply') === 0) return true;
  const list = VALID[role][screen];
  return !list || list.indexOf(st) >= 0;
}
function sampleFlow(status, role, o) {
  o = o || {};
  if (status === 'rescheduled-by-mentor') return { ...SAMPLE, status: 'rescheduled', proposals: NEW_PROPOSALS, fixedSlot: null, messages: [{ from: 'mentor', type: 'reschedule-reason', text: MENTOR_RESCHEDULE_TEXT }], cancelStage: null, cancelBy: null, review: null };
  const f = { ...SAMPLE, status, proposals: [], fixedSlot: null, messages: [], cancelStage: null, cancelBy: null, review: null };
  if (status === 'scheduling-received' || status === 'scheduling-sent') f.proposals = PROPOSALS;
  if (status === 'reschedule-requested') { f.proposals = PROPOSALS; f.messages = [{ from: 'mentee', type: 'reschedule', text: RESCHEDULE_TEXT }]; }
  if (status === 'rescheduled') { f.proposals = NEW_PROPOSALS; f.messages = [{ from: 'mentee', type: 'reschedule', text: RESCHEDULE_TEXT }]; }
  if (status === 'fixed') f.fixedSlot = KST(10, 14, 18, 0);
  if (status === 'fixed-24h') f.fixedSlot = KST(10, 9, 18, 0);
  if (status === 'done') {
    f.fixedSlot = KST(10, 6, 18, 0);
    if (o.cheer != null ? o.cheer : role === 'mentee') f.messages = [CHEER_MSG()];
    if (o.review) f.review = SAMPLE_REVIEW;
  }
  if (status === 'cancelled') {
    const by = o.cancelBy || role;
    f.cancelBy = by;
    if (by === 'noshow') { f.cancelStage = 'fixed'; f.fixedSlot = KST(10, 6, 18, 0); if (o.reply) f.messages = [{ from: 'mentor', type: 'cancel-reply', text: NOSHOW_REPLY_TEXT }]; }
    else if (by === 'mentor') { f.cancelStage = 'fixed'; f.fixedSlot = KST(10, 14, 18, 0); f.messages = [{ from: 'mentor', type: 'cancel', text: CANCEL_TEXT.mentor }]; }
    else { f.cancelStage = 'scheduling'; f.messages = [{ from: 'mentee', type: 'cancel', text: CANCEL_TEXT.mentee }]; if (o.reply) f.messages.push({ from: 'mentor', type: 'cancel-reply', text: REPLY_TEXT }); }
  }
  return f;
}
function cancelledFlow(before, role) {
  const f = sampleFlow('cancelled', role, { cancelBy: role });
  if (before === 'applied') { f.cancelStage = 'applied'; f.messages = []; }
  else if (before === 'fixed' || before === 'fixed-24h') f.cancelStage = 'fixed';
  return f;
}

class Component extends DCLogic {
  state = this.initial();
  hist = [];
  scrollRef = React.createRef();
  frameRef = React.createRef();

  initial() {
    const q = new URLSearchParams(window.location.search);
    const role = q.get('role') === 'mentor' ? 'mentor' : 'mentee';
    let screen = q.get('screen');
    if (!SCREENS[role].some((s) => s.value === screen)) screen = role === 'mentee' ? 'apply-1' : 'detail';
    const byMentor = role === 'mentee' && q.get('status') === 'rescheduled-by-mentor';
    const raw = normStatus(role, q.get('status'));
    let st = STATUSES[role].some((s) => s.value === raw) ? raw : null;
    let flow;
    if (screen === 'cancel-done' && st && st !== 'cancelled') flow = cancelledFlow(st, role);
    else {
      st = st || 'applied';
      if (!validFor(role, screen, st)) st = VALID[role][screen][0];
      const o = {
        cancelBy: absBy(['me', 'other', 'noshow'].indexOf(q.get('cancelBy')) >= 0 ? q.get('cancelBy') : 'me', role),
        reply: q.get('reply') === '1' || screen === 'cancel-msg-sent',
        review: q.get('review') === '1' || screen === 'review-done',
        cheer: screen === 'cheer-sent' || screen === 'cheer-view' ? true : q.has('cheer') ? q.get('cheer') === '1' : undefined,
      };
      if (screen === 'cancel-msg-write' && o.cancelBy === 'mentor') o.cancelBy = 'mentee';
      flow = sampleFlow(byMentor && st === 'rescheduled' ? 'rescheduled-by-mentor' : st, role, o);
    }
    const loadState = q.get('state') === 'loading' || q.get('state') === 'error' ? q.get('state') : 'normal';
    const view = q.get('view') === 'mobile' ? 'mobile' : 'desktop';
    const embed = q.get('embed') === '1';
    const frame = q.get('frame') === '1';
    const fail = q.get('fail') === '1';
    const prefill = screen === 'apply-2' ? 1 : (screen === 'apply-pay' || screen === 'apply-done') ? 2 : 0;
    const base = { role, screen, flow, loadState, fail };
    return { ...base, view, embed, frame, prefill, frameSrc: !embed && view === 'mobile' ? this.srcFor(base) : '', isMobile: window.matchMedia('(max-width: 768px)').matches };
  }

  params(s) {
    const q = new URLSearchParams({ role: s.role, screen: s.screen, status: s.role === 'mentee' && toCard(s.role, s.flow).rescheduleByMentor ? 'rescheduled-by-mentor' : s.flow.status });
    const o = flowOpts(s.flow);
    if (s.flow.status === 'cancelled') { q.set('cancelBy', relBy(o.cancelBy || s.role, s.role)); if (o.reply) q.set('reply', '1'); }
    if (s.flow.status === 'done') { if (o.review) q.set('review', '1'); q.set('cheer', o.cheer ? '1' : '0'); }
    return q;
  }
  srcFor(s) {
    const q = this.params(s);
    q.set('embed', '1');
    if (s.loadState !== 'normal') q.set('state', s.loadState);
    if (s.fail) q.set('fail', '1');
    return window.location.pathname + '?' + q.toString();
  }

  componentDidMount() {
    this.mq = window.matchMedia('(max-width: 768px)');
    this.onMq = () => this.setState({ isMobile: this.mq.matches });
    this.mq.addEventListener('change', this.onMq);
    this.onMsg = (e) => {
      const d = e.data || {};
      if (d.type === 'mf-set' && this.state.embed) {
        this.hist = [];
        this.setState({ role: d.role, screen: d.screen, flow: d.flow, loadState: d.loadState, fail: d.fail }, () => this.afterNav(false));
      } else if (d.type === 'mf-state' && !this.state.embed) {
        this.setState({ role: d.role, screen: d.screen, flow: d.flow, loadState: d.loadState }, () => this.syncUrl());
      }
    };
    window.addEventListener('message', this.onMsg);
    this.syncUrl();
    this.dsWait = setInterval(() => { if (window.MentreeDesignSystem_2f86cf) { clearInterval(this.dsWait); this.forceUpdate(); } }, 60);
  }

  componentWillUnmount() {
    if (this.mq) this.mq.removeEventListener('change', this.onMq);
    window.removeEventListener('message', this.onMsg);
    clearInterval(this.dsWait);
  }

  syncUrl() {
    const s = this.state;
    if (s.embed) return;
    const q = this.params(s);
    if (s.loadState !== 'normal') q.set('state', s.loadState);
    if (s.view === 'mobile') q.set('view', 'mobile');
    if (s.frame) q.set('frame', '1');
    if (s.fail) q.set('fail', '1');
    try { history.replaceState(history.state, '', window.location.pathname + '?' + q.toString()); } catch (e) {}
  }

  afterNav(post = true) {
    const s = this.state;
    this.syncUrl();
    if (s.embed && post && window.parent !== window) window.parent.postMessage({ type: 'mf-state', role: s.role, screen: s.screen, flow: s.flow, loadState: s.loadState }, '*');
    const el = this.scrollRef.current;
    if (el && s.screen.indexOf('apply') === 0 && s.screen !== 'apply-done') el.scrollTop = 0;
  }

  pushInner() {
    const s = this.state;
    const f = this.frameRef.current;
    if (s.view === 'mobile' && !s.embed && f && f.contentWindow) {
      f.contentWindow.postMessage({ type: 'mf-set', role: s.role, screen: s.screen, flow: s.flow, loadState: s.loadState, fail: s.fail }, '*');
    }
  }

  demo(patch) {
    this.hist = [];
    this.setState(patch, () => { this.afterNav(); this.pushInner(); });
  }

  setRole = (r) => {
    const s = this.state;
    if (!r || r === s.role) return;
    const st = normStatus(r, s.flow.status);
    let screen = s.screen;
    if (!SCREENS[r].some((x) => x.value === screen) || !validFor(r, screen, st)) screen = 'detail';
    this.demo({ role: r, screen, flow: { ...s.flow, status: st } });
  };
  setScreen = (sc) => {
    const s = this.state;
    let flow = s.flow;
    if (!validFor(s.role, sc, flow.status)) flow = sampleFlow(VALID[s.role][sc][0], s.role);
    this.demo({ screen: sc, flow });
  };
  setStatus = (st) => {
    const s = this.state;
    const screen = validFor(s.role, s.screen, st) ? s.screen : 'detail';
    this.demo({ flow: sampleFlow(st, s.role), screen });
  };
  // 완료 · 취소 갈래 토글 — 같은 상태의 표본을 갈래만 바꿔 다시 만든다
  setVariant = (patch) => {
    const s = this.state;
    const o = { ...flowOpts(s.flow), ...patch };
    let screen = s.screen;
    if ((screen === 'cancel-msg-write' || screen === 'cancel-msg-sent') && (o.reply || o.cancelBy === 'mentor')) screen = 'detail';
    if ((screen === 'review' || screen === 'review-done') && o.review) screen = 'detail';
    if (screen === 'cheer-write' && o.cheer) screen = 'detail';
    if ((screen === 'cheer-sent' || screen === 'cheer-view' || screen === 'cheer-read') && !o.cheer) screen = 'detail';
    this.demo({ flow: sampleFlow(s.flow.status, s.role, o), screen });
  };
  setCancelBy = (v) => { if (v) this.setVariant({ cancelBy: absBy(v, this.state.role) }); };
  setReply = (v) => { if (v) this.setVariant({ reply: v === '1' }); };
  setReview = (v) => { if (v) this.setVariant({ review: v === '1' }); };
  setCheer = (v) => { if (v) this.setVariant({ cheer: v === '1' }); };
  setLoad = (v) => { if (v) this.demo({ loadState: v }); };
  setFail = (v) => { if (v) this.demo({ fail: v === 'fail' }); };
  setView = (v) => {
    if (!v || v === this.state.view) return;
    if (v === 'mobile') this.setState({ view: v, frameSrc: this.srcFor(this.state) }, () => this.syncUrl());
    else this.setState({ view: v }, () => this.syncUrl());
  };
  onFrameLoad = () => this.pushInner();

  // MentoringCard 버튼 키 → 흐름 화면
  mcAction = (key) => {
    const st = this.state.flow.status;
    if (key === 'cancel-1') return this.go(this.state.role === 'mentor' && st === 'applied' ? 'decline' : 'cancel');
    if (key === 'fix-schedule') return this.go('fix-schedule');
    if (key === 'accept') return this.go(st === 'applied' ? 'accept' : 'reschedule');
    if (key === 'mentor-message' || key === 'cancel-msg-view') return this.go('detail');
    if (key === 'cheer-write' || key === 'cheer-view' || key === 'cheer-read' || key === 'review' || key === 'cancel-msg-write') return this.go(key);
    if (key === 'my-review' || key === 'mentee-review') return this.go('detail');
    if (key === 'apply-again') return this.go('apply-1');
    this.setState({ note: '이 프로토타입에 포함되지 않은 화면입니다.' });
  };
  closeNote = () => this.setState({ note: '' });
  go = (screen, patch) => {
    this.hist.push(this.state.screen);
    this.setState((s) => ({ screen, flow: patch ? { ...s.flow, ...patch } : s.flow }), () => this.afterNav());
  };
  back = () => {
    const cur = this.state.screen;
    const prev = this.hist.pop() || (cur === 'detail' ? 'card' : 'detail');
    this.setState({ screen: prev }, () => this.afterNav());
  };
  close = () => { this.hist = []; this.setState({ screen: 'card' }, () => this.afterNav()); };
  retry = () => this.setState({ loadState: 'normal' }, () => { this.afterNav(); this.pushInner(); });
  applyGo = (sc) => this.setState({ screen: sc }, () => this.afterNav());
  applyFinish = (data) => {
    this.hist = [];
    this.setState({ screen: 'card', flow: { ...sampleFlow('applied'), ...(data || {}), appliedAt: `${TODAY.y}.${pad(TODAY.m)}.${pad(TODAY.d)}` } }, () => this.afterNav());
  };
  applyExit = (target) => {
    if (target === 'mypage') { this.hist = []; this.setState({ screen: 'card' }, () => this.afterNav()); }
  };

  renderVals() {
    const s = this.state;
    const role = s.role;
    const flow = s.flow;
    const st = flow.status;
    const viewer = PEOPLE[role];
    const other = role === 'mentee' ? PEOPLE.mentor : PEOPLE.mentee;
    const isApply = role === 'mentee' && s.screen.indexOf('apply') === 0;
    const showDevice = !s.embed && s.view === 'mobile';
    const mc = toCard(role, flow);
    const sentence = sentenceFor(role, mc);
    const vo = flowOpts(flow);
    return {
      showDemo: !s.embed && !s.frame,
      roleOpts: [{ value: 'mentee', label: '멘티' }, { value: 'mentor', label: '멘토' }],
      role,
      screenOpts: SCREENS[role],
      screen: s.screen,
      statusOpts: STATUSES[role],
      statusKey: role === 'mentee' && mc.rescheduleByMentor ? 'rescheduled-by-mentor' : st,
      statusDisabled: isApply,
      showCancelOpts: !isApply && st === 'cancelled',
      showReply: !isApply && st === 'cancelled' && vo.cancelBy !== 'mentor',
      showDoneOpts: !isApply && st === 'done',
      cancelByOpts: [{ value: 'me', label: 'me' }, { value: 'other', label: 'other' }, { value: 'noshow', label: 'noshow' }],
      yesNo: [{ value: '0', label: '0' }, { value: '1', label: '1' }],
      cancelByKey: relBy(vo.cancelBy || role, role),
      replyKey: vo.reply ? '1' : '0', reviewKey: vo.review ? '1' : '0', cheerKey: vo.cheer ? '1' : '0',
      setCancelBy: this.setCancelBy, setReply: this.setReply, setReview: this.setReview, setCheer: this.setCheer,
      loadOpts: [{ value: 'normal', label: 'normal' }, { value: 'loading', label: 'loading' }, { value: 'error', label: 'error' }],
      loadState: s.loadState,
      viewOpts: [{ value: 'desktop', label: 'desktop' }, { value: 'mobile', label: 'mobile' }],
      view: s.view,
      failOpts: [{ value: 'ok', label: '성공' }, { value: 'fail', label: '실패' }],
      failKey: s.fail ? 'fail' : 'ok',
      setRole: this.setRole, setScreen: this.setScreen, setStatus: this.setStatus, setLoad: this.setLoad, setView: this.setView, setFail: this.setFail,
      showDevice,
      frameSrc: s.frameSrc,
      frameRef: this.frameRef,
      onFrameLoad: this.onFrameLoad,
      showContent: !showDevice,
      scrollRef: this.scrollRef,
      isApply,
      isCardStage: !isApply,
      prefill: s.prefill,
      isMobile: s.isMobile,
      applyGo: this.applyGo, applyFinish: this.applyFinish, applyExit: this.applyExit, retry: this.retry,
      flow,
      mc, sentence,
      mcDetail: () => this.go('detail'),
      mcAction: this.mcAction,
      noteOpen: !!s.note, note: s.note || '', closeNote: this.closeNote,
      fail: s.fail,
      people: PEOPLE,
      today: TODAY,
      go: this.go, back: this.back, close: this.close,
    };
  }
}
