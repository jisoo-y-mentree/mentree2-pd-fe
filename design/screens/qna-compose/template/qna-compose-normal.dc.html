<x-dc>
<helmet>

<x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Card" hint-size="100%,900px"><x-import component-from-global-scope="MentreeDesignSystem_2f86cf.CardContent" hint-size="100%,880px"><form style="display: flex; flex-direction: column; gap: 28px" onSubmit="{{ preventSubmit }}">

    <sc-if value="{{ ddPlaceholder_country }}"><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted-foreground)">국가 선택</span></sc-if>

  </button>
    <sc-if value="{{ ddOpen_country }}">

        </div>
      </sc-for>
    </div>
  </sc-if>
  </sc-if>
  <sc-if value="{{ ddDisabled_country }}">
    <button type="button" id="qc-country" disabled aria-haspopup="listbox" aria-expanded="{{ ddOpen_country }}" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; height: 38px; padding: 0 11px 0 12px; background: var(--muted); border: 1px solid var(--input); border-radius: var(--radius-md); font-family: var(--font-sans); font-size: var(--text-body); line-height: 1; letter-spacing: 0; text-align: left; color: var(--foreground); opacity: 0.6; cursor: not-allowed">
    <sc-if value="{{ ddFilled_country }}" hint-placeholder-val="{{ true }}"><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ ddLabel_country }}</span></sc-if>
    <sc-if value="{{ ddPlaceholder_country }}"><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted-foreground)">국가 선택</span></sc-if>
    <span class="hgi" style="--hgi: url('https://cdn.jsdelivr.net/npm/@hugeicons/static/icons/arrow-down-01.svg'); flex: none; font-size: 16px; color: var(--muted-foreground)"></span>
  </button>
  </sc-if>
</div></x-import>
      <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.RadioGroup" name="qc-country-scope" options="{{ scopeOptions }}" value="{{ scope }}" onChange="{{ set_scope }}" hint-size="100%,24px"></x-import>
    </div>
    <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Field" label="키워드" required="{{ true }}" description="질문하려는 키워드를 선택해주세요." html-for="qc-keyword" hint-size="100%,110px"><div data-dd="true" style="position: relative">
  <button type="button" id="qc-keyword" aria-haspopup="listbox" aria-expanded="{{ ddOpen_keyword }}" onClick="{{ ddToggle_keyword }}" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; height: 38px; padding: 0 11px 0 12px; background: var(--card); border: 1px solid var(--input); border-radius: var(--radius-md); font-family: var(--font-sans); font-size: var(--text-body); line-height: 1; letter-spacing: 0; text-align: left; color: var(--foreground); opacity: 1; cursor: pointer">
    <sc-if value="{{ ddFilled_keyword }}" hint-placeholder-val="{{ true }}"><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ ddLabel_keyword }}</span></sc-if>
    <sc-if value="{{ ddPlaceholder_keyword }}"><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted-foreground)">질문 키워드 선택</span></sc-if>
    <span class="hgi" style="--hgi: url('https://cdn.jsdelivr.net/npm/@hugeicons/static/icons/arrow-down-01.svg'); flex: none; font-size: 16px; color: var(--muted-foreground)"></span>
  </button>
  <sc-if value="{{ ddOpen_keyword }}">
    <div role="listbox" style="position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30; display: flex; flex-direction: column; max-height: 296px; overflow-y: auto; padding: 4px; border-radius: var(--radius-md); background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow-md)">
      <sc-for list="{{ ddItems_keyword }}" as="o" hint-placeholder-count="4">
        <div role="option" aria-selected="{{ o.selected }}" onMouseDown="{{ o.pick }}" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 36px; padding: 0 12px; border-radius: var(--radius-sm); font-family: var(--font-sans); font-size: var(--text-body); line-height: 1; letter-spacing: 0; color: var(--foreground); cursor: pointer" style-hover="background: var(--muted)">
          <span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ o.label }}</span>
          <sc-if value="{{ o.selected }}"><span class="hgi" style="--hgi: url('https://cdn.jsdelivr.net/npm/@hugeicons/static/icons/tick-02.svg'); flex: none; font-size: 16px; color: var(--primary)"></span></sc-if>
        </div>
      </sc-for>
    </div>
  </sc-if>
</div></x-import>
  </div>

  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Field" label="제목" required="{{ true }}" html-for="qc-title" hint-size="100%,72px"><div style="display: flex; flex-direction: column; gap: 6px">
    <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Input" id="qc-title" placeholder="[문구 미정] 제목을 입력해 주세요" value="{{ title }}" onChange="{{ set_title }}" hint-size="100%,38px"></x-import>
    <div class="tabular" style="{{ titleCountStyle }}">{{ titleCount }}/50자</div>
  </div></x-import>

  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Field" label="본문" required="{{ true }}" html-for="qc-body" hint-size="100%,300px"><div style="display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--input); border-radius: var(--radius-md); overflow: hidden">
      <div style="display: flex; align-items: center; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--border)">
  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.IconButton" icon="text-bold" variant="ghost" size="sm" aria-label="굵게" hint-size="32px,32px"></x-import>
  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.IconButton" icon="text-italic" variant="ghost" size="sm" aria-label="기울임" hint-size="32px,32px"></x-import>
  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.IconButton" icon="left-to-right-list-bullet" variant="ghost" size="sm" aria-label="글머리 기호 목록" hint-size="32px,32px"></x-import>
  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.IconButton" icon="left-to-right-list-number" variant="ghost" size="sm" aria-label="번호 목록" hint-size="32px,32px"></x-import>
</div>
      <div id="qc-body" style="min-height: 220px; padding: 14px 12px; font-size: var(--text-body); line-height: var(--text-body--line-height); letter-spacing: var(--text-body--letter-spacing); color: var(--muted-foreground); white-space: pre-wrap">궁금한 내용을 질문해주세요.

질문 시 이런 점을 주의해주세요.
• 답변이 등록되면 질문 수정/삭제가 불가합니다.
• 질문 내용에 개인정보(실명, 전화번호, SNS아이디)가 포함되지 않게 해 주세요.
• 개인정보 입력이 확인될 경우 약관에 의거해 삭제될 수 있습니다.
• 현재 상황과 궁금한 부분을 구체적으로 작성할수록 좋은 답변을 얻을 가능성이 높습니다.</div>
    </div>
    <div class="tabular" style="align-self: flex-end; font-size: var(--text-caption); line-height: var(--text-caption--line-height); letter-spacing: var(--text-caption--letter-spacing); color: var(--muted-foreground)">0/1000자</div>
  </div></x-import>

  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Field" label="태그" description="최대 10개까지 태그 설정이 가능합니다." html-for="qc-tags" hint-size="100%,130px"><x-import component-from-global-scope="MentreeDesignSystem_2f86cf.TagInput" id="qc-tags" value="{{ tags }}" onChange="{{ set_tags }}" suggestions="{{ tagSuggestions }}" completions="{{ tagCompletions }}" max="10" placeholder="태그 입력하기" hint-size="100%,96px"></x-import></x-import>
</form></x-import></x-import>
<div class="qc-actions" style="display: flex; justify-content: flex-end; gap: 10px">
  <a href="qna-compose-modal-submit.dc.html" style="display: block; text-decoration: none"><x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Button" variant="primary" size="lg" disabled="{{ submitDisabled }}" hint-size="auto,44px">질문 등록하기</x-import></a>
</div>
    </div>
  </main>
  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Footer" brand="{{ footerBrand }}" onNavigate="{{ nav }}" hint-size="100%,280px"></x-import>
  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.BottomTabBar" active-key="qna" onNavigate="{{ nav }}" hint-size="100%,56px"></x-import>
  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Toast" open="{{ toastOpen }}" message="{{ toastMessage }}" actions="{{ toastActions }}" onDismiss="{{ toastDismiss }}" hint-size="0px,0px"></x-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {"country":"","scope":"","keyword":"","title":"","tags":[],"toast":null,"ddOpen":null};
  componentDidMount() {
    const t = () => (window.MentreeDesignSystem_2f86cf ? this.forceUpdate() : setTimeout(t, 60));
    t();
    this.ddBind();
  }
  nav(item) { if (item && item.key === "qna") window.location.assign("../../qna-feed/template/qna-feed-normal.dc.html"); }
  ddBind() {
    this._ddAway = (e) => { if (!(e.target.closest && e.target.closest("[data-dd]"))) this.ddClose(); };
    this._ddKey = (e) => { if (e.key === "Escape") this.ddClose(); };
    document.addEventListener("mousedown", this._ddAway);
    document.addEventListener("keydown", this._ddKey);
  }
  componentWillUnmount() {
    document.removeEventListener("mousedown", this._ddAway);
    document.removeEventListener("keydown", this._ddKey);
  }
  ddClose() { if (this.state.ddOpen) this.setState({ ddOpen: null }); }
  ddVals(key, options, value, onPick, opts) {
    const o = opts || {};
    const items = (options || []).map((it) => {
      const val = typeof it === "string" ? it : it.value;
      const lab = typeof it === "string" ? it : it.label;
      return { value: val, label: lab, selected: val === value, pick: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        this.setState({ ddOpen: null });
        onPick(val);
      } };
    });
    const sel = items.filter((i) => i.selected)[0];
    const out = {};
    out["ddOpen_" + key] = this.state.ddOpen === key && !o.disabled;
    out["ddItems_" + key] = items;
    out["ddLabel_" + key] = sel ? sel.label : "";
    out["ddFilled_" + key] = !!sel;
    out["ddPlaceholder_" + key] = !sel;
    out["ddDisabled_" + key] = !!o.disabled;
    out["ddEnabled_" + key] = !o.disabled;
    out["ddToggle_" + key] = () => this.setState((s) => ({ ddOpen: s.ddOpen === key ? null : key }));
    return out;
  }
  renderVals() {
    const ns = window.MentreeDesignSystem_2f86cf || {};
    const h = React.createElement;
    const s = this.state;
    const setter = (key) => (v) => this.setState({ [key]: v && v.target ? v.target.value : v });
    const allCountries = s.scope === "all";
    const link = (key, href, variant, text) => h("a", { key, href, style: { textDecoration: "none" } }, h(ns.Button, { variant, size: "md" }, text));
    const titleTooLong = s.title.length > 50;
    const filled = (allCountries || s.country) && s.keyword && s.title.trim().length > 0 && !titleTooLong;
    const dialog = null;
    const countryOptions = ["일본", "미국", "독일", "영국", "캐나다", "호주", "네덜란드", "프랑스", "대만"];
    const keywordOptions = ["취업 준비", "비자·이민", "이직", "연봉 협상", "대학원", "현지 생활", "커리어 전환"];
    return Object.assign({},
      this.ddVals("country", countryOptions, allCountries ? "" : s.country, setter("country"), { disabled: allCountries }),
      this.ddVals("keyword", keywordOptions, s.keyword, setter("keyword")),
      {
      noop: () => {},
      nav: (item) => this.nav(item),
      footerBrand: h("img", { src: "../../../ds-export/project/assets/logo/mentree-logo.svg", alt: "mentree", style: { height: 24, width: "auto", display: "block" } }),
      preventSubmit: (e) => e.preventDefault(),
      dialog,
      toastOpen: !!s.toast, toastMessage: (s.toast && s.toast.message) || "", toastActions: [], toastDismiss: () => this.setState({ toast: null }),
      country: allCountries ? "" : s.country, set_country: setter("country"), countryDisabled: allCountries,
      scope: s.scope, set_scope: (v) => this.setState({ scope: s.scope === v ? "" : v }),
      keyword: s.keyword, set_keyword: setter("keyword"),
      title: s.title, set_title: (e) => this.setState({ title: (e && e.target ? e.target.value : e || "").slice(0, 50) }),
      titleCount: s.title.length, titleTooLong,
      titleCountStyle: { alignSelf: "flex-end", fontSize: "var(--text-caption)", lineHeight: "var(--text-caption--line-height)", letterSpacing: "var(--text-caption--letter-spacing)", color: titleTooLong ? "var(--destructive)" : "var(--muted-foreground)" },
      tags: s.tags, set_tags: (next) => this.setState({ tags: next }),
      tagSuggestions: ["일본취업", "신졸채용", "취업비자", "연봉협상", "이직준비"],
      tagCompletions: [],
      submitDisabled: !filled,
      countryOptions, keywordOptions,
      scopeOptions: [{ value: "all", label: "모든 국가에 해당함" }],
    });
  }
}
</script>
</body>
