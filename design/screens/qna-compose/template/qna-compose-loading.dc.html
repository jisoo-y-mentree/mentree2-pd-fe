<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../../../ds-export/project/tokens/fonts.css">
  <link rel="stylesheet" href="../../../ds-export/project/tokens/colors.css">
  <link rel="stylesheet" href="../../../ds-export/project/tokens/typography.css">
  <link rel="stylesheet" href="../../../ds-export/project/tokens/spacing.css">
  <link rel="stylesheet" href="../../../ds-export/project/tokens/icons.css">
  <link rel="stylesheet" href="../../../ds-export/project/tokens/base.css">
  <link rel="stylesheet" href="../../../ds-export/project/styles.css">
  <script src="ds-asset-path.js"></script>
  <script src="../../../ds-export/project/_ds_bundle.js"></script>
  <style>
    a { color: var(--primary); text-decoration: none; }
    a:hover { color: color-mix(in oklch, var(--primary) 82%, var(--sage-950)); }
    @media (max-width: 768px) {
      .qc-container { padding-left: 16px !important; padding-right: 16px !important; }
      .qc-main { padding: 24px 0 40px !important; gap: 24px !important; }
      .qc-shell { padding-bottom: calc(56px + env(safe-area-inset-bottom)) !important; }
      .qc-h0 { font-size: 20px !important; }
      .qc-two { grid-template-columns: minmax(0, 1fr) !important; }
      .qc-actions { flex-direction: column-reverse !important; align-items: stretch !important; }
      .qc-actions > * { width: 100% !important; }
    }
  </style>
</helmet>
<div class="qc-shell" style="display: flex; flex-direction: column; min-height: 100vh; background: var(--background); color: var(--foreground)">
  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Header" active-key="qna" onNavigate="{{ nav }}" hint-size="100%,64px"></x-import>
  <main class="qc-container" style="flex: 1 1 auto; width: 100%; max-width: var(--container-max); margin: 0 auto; padding: 0 var(--container-pad)">
    <div class="qc-main" style="width: 100%; max-width: 800px; margin: 0 auto; padding: 40px 0 72px; display: flex; flex-direction: column; gap: 28px">
      <h1 class="text-h0 qc-h0" style="margin: 0">Q&amp;A멘토링 질문 작성</h1>
<x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Card" hint-size="100%,900px"><x-import component-from-global-scope="MentreeDesignSystem_2f86cf.CardContent" hint-size="100%,880px"><form style="display: flex; flex-direction: column; gap: 28px" onSubmit="{{ preventSubmit }}">
  <div class="qc-two" style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start">
    <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Field" label="국가" required="{{ true }}" description="어느 국가에 해당하는 질문인지 선택해주세요." html-for="qc-country" hint-size="100%,110px"><div style="display: flex; flex-direction: column; gap: 10px">
      <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Select" id="qc-country" options="{{ countryOptions }}" placeholder="국가 선택" value="{{ country }}" onChange="{{ set_country }}" disabled="{{ countryDisabled }}" hint-size="100%,38px"></x-import>
      <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.RadioGroup" name="qc-country-scope" options="{{ scopeOptions }}" value="{{ scope }}" onChange="{{ set_scope }}" disabled="{{ true }}" hint-size="100%,24px"></x-import>
    </div></x-import>
    <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Field" label="키워드" required="{{ true }}" description="질문하려는 키워드를 선택해주세요." html-for="qc-keyword" hint-size="100%,110px"><x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Select" id="qc-keyword" options="{{ keywordOptions }}" placeholder="질문 키워드 선택" value="{{ keyword }}" onChange="{{ set_keyword }}" disabled="{{ true }}" hint-size="100%,38px"></x-import></x-import>
  </div>

  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Field" label="제목" required="{{ true }}" html-for="qc-title" hint-size="100%,72px"><div style="display: flex; flex-direction: column; gap: 6px">
    <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Input" id="qc-title" placeholder="[문구 미정] 제목을 입력해 주세요" value="{{ title }}" onChange="{{ set_title }}" disabled="{{ true }}" hint-size="100%,38px"></x-import>
    <div class="tabular" style="{{ titleCountStyle }}">{{ titleCount }}/50</div>
  </div></x-import>

  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Field" label="본문" required="{{ true }}" html-for="qc-body" hint-size="100%,280px"><div style="display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--input); border-radius: var(--radius-md); overflow: hidden">
    <div style="display: flex; align-items: center; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--border)">
  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.IconButton" icon="text-bold" variant="ghost" size="sm" aria-label="굵게" hint-size="32px,32px"></x-import>
  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.IconButton" icon="text-italic" variant="ghost" size="sm" aria-label="기울임" hint-size="32px,32px"></x-import>
  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.IconButton" icon="left-to-right-list-bullet" variant="ghost" size="sm" aria-label="글머리 기호 목록" hint-size="32px,32px"></x-import>
  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.IconButton" icon="left-to-right-list-number" variant="ghost" size="sm" aria-label="번호 목록" hint-size="32px,32px"></x-import>
</div>
    <div id="qc-body" style="min-height: 200px; padding: 14px 12px; font-size: var(--text-body); line-height: 1.7; color: var(--foreground); white-space: pre-wrap">내년 3월에 한국 대학을 졸업합니다. 일본어는 JLPT N2 이고, 도쿄의 자사 서비스 기업 신졸 전형을 보고 있습니다.

지금까지 알아본 것은 마이나비·리크나비 두 곳의 일정과, 외국인 채용 실적이 있는 기업 목록입니다. 정하지 못한 것은 지원 시점입니다. 졸업 전에 넣어야 하는지, 졸업 후 취업 활동 비자로 바꾸고 넣어도 되는지 판단이 서지 않습니다.</div>
      <div class="tabular" style="align-self: flex-end; padding: 0 12px 10px; font-size: var(--text-caption); color: var(--muted-foreground)">248/1000</div>
  </div></x-import>

  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Field" label="태그" description="최대 10개까지 태그 설정이 가능합니다." html-for="qc-tags" hint-size="100%,130px"><x-import component-from-global-scope="MentreeDesignSystem_2f86cf.TagInput" id="qc-tags" value="{{ tags }}" onChange="{{ set_tags }}" suggestions="{{ tagSuggestions }}" completions="{{ tagCompletions }}" max="10" placeholder="태그 입력하기" disabled="{{ true }}" hint-size="100%,96px"></x-import></x-import>
</form></x-import></x-import>
<div class="qc-actions" style="display: flex; justify-content: flex-end; gap: 10px">
  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Button" variant="primary" size="lg" disabled="{{ submitDisabled }}" icon-left="loading-03" hint-size="auto,44px">[문구 미정] 등록하는 중</x-import>
</div>
    </div>
  </main>
  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Footer" onNavigate="{{ nav }}" hint-size="100%,280px"></x-import>
  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.BottomTabBar" active-key="qna" onNavigate="{{ nav }}" hint-size="100%,56px"></x-import>
  <x-import component-from-global-scope="MentreeDesignSystem_2f86cf.Toast" open="{{ toastOpen }}" message="{{ toastMessage }}" actions="{{ toastActions }}" onDismiss="{{ toastDismiss }}" hint-size="0px,0px"></x-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {"country":"일본","scope":"","keyword":"취업 준비","title":"일본 IT 기업 신졸 채용, 한국 대학 졸업생도 지원할 수 있나요?","tags":["일본취업","신졸채용","JLPT"],"toast":null};
  componentDidMount() {
    const t = () => (window.MentreeDesignSystem_2f86cf ? this.forceUpdate() : setTimeout(t, 60));
    t();
  }
  nav(item) { if (item && item.key === "qna") window.location.assign("../../qna-feed/template/qna-feed-normal.dc.html"); }
  renderVals() {
    const ns = window.MentreeDesignSystem_2f86cf || {};
    const h = React.createElement;
    const s = this.state;
    const setter = (key) => (v) => this.setState({ [key]: v && v.target ? v.target.value : v });
    const allCountries = s.scope === "all";
    const link = (key, href, variant, text) => h("a", { key, href, style: { textDecoration: "none" } }, h(ns.Button, { variant, size: "md" }, text));
    const titleTooLong = s.title.length > 50;
    const filled = (allCountries || s.country) && s.keyword && s.title.trim().length > 0 && !titleTooLong;
    const dialog = null;
    return {
      noop: () => {},
      nav: (item) => this.nav(item),
      preventSubmit: (e) => e.preventDefault(),
      dialog,
      toastOpen: !!s.toast, toastMessage: (s.toast && s.toast.message) || "", toastActions: [], toastDismiss: () => this.setState({ toast: null }),
      country: allCountries ? "" : s.country, set_country: setter("country"), countryDisabled: allCountries,
      scope: s.scope, set_scope: (v) => this.setState({ scope: s.scope === v ? "" : v }),
      keyword: s.keyword, set_keyword: setter("keyword"),
      title: s.title, set_title: (e) => this.setState({ title: (e && e.target ? e.target.value : e || "").slice(0, 50) }),
      titleCount: s.title.length, titleTooLong,
      titleCountStyle: { alignSelf: "flex-end", fontSize: "var(--text-caption)", color: titleTooLong ? "var(--destructive)" : "var(--muted-foreground)" },
      tags: s.tags, set_tags: (next) => this.setState({ tags: next }),
      tagSuggestions: ["일본취업", "신졸채용", "취업비자", "연봉협상", "이직준비"],
      tagCompletions: [],
      submitDisabled: !filled,
      countryOptions: ["일본", "미국", "독일", "영국", "캐나다", "호주", "네덜란드", "프랑스", "대만"],
      keywordOptions: ["취업 준비", "비자·이민", "이직", "연봉 협상", "대학원", "현지 생활", "커리어 전환"],
      scopeOptions: [{ value: "all", label: "모든 국가에 해당함" }],
    };
  }
}
</script>
</body>
</html>
