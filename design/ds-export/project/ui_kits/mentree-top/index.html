  .hero-globe { position: absolute; z-index: 0; top: 50%; right: calc(-0.45 * clamp(560px, 52vw, 760px)); transform: translateY(-50%); width: clamp(560px, 52vw, 760px); aspect-ratio: 1; }

      { src: "../../assets/flags/japan.svg", x: 44, y: 33 },
      { src: "../../assets/flags/hong-kong.svg", x: 27, y: 44 },
      { src: "../../assets/flags/taiwan.svg", x: 38, y: 47 },
      { src: "../../assets/flags/malaysia.svg", x: 24, y: 58 },
      { src: "../../assets/flags/australia.svg", x: 44, y: 72 },
    ];
    return (
      <div className="hero-globe" aria-hidden="true">
        <svg viewBox="0 0 400 400" style={{ width: "100%", height: "100%", display: "block" }}>
          <defs>
            <radialGradient id="heroSea" cx="30%" cy="35%" r="80%">
              <stop offset="0%" stopColor="#e9f2f7" />
              <stop offset="100%" stopColor="#c6dcea" />
            </radialGradient>
            <clipPath id="heroGlobeClip"><circle cx="200" cy="200" r="200" /></clipPath>
          </defs>
          <circle cx="200" cy="200" r="200" fill="url(#heroSea)" />
          <g clipPath="url(#heroGlobeClip)" style={{ fill: "color-mix(in oklch, var(--primary) 20%, white)" }}>
            {/* 대륙 실루엣(추상 blob) — 아시아 대륙 / 동남아 도서 / 호주. 좌반부 배치. */}
            <path d="M28,150 Q50,60 150,58 Q240,60 250,120 Q258,172 200,184 Q140,196 96,180 Q44,176 28,150 Z" />
            <ellipse cx="140" cy="222" rx="15" ry="8" />
            <ellipse cx="168" cy="236" rx="11" ry="6" />
            <ellipse cx="118" cy="238" rx="9" ry="5" />
            <ellipse cx="182" cy="300" rx="48" ry="32" />
          </g>
        </svg>
        {FLAGS.map((f) => (
          <span key={f.src} style={{ position: "absolute", left: `${f.x}%`, top: `${f.y}%`, transform: "translate(-50%, -50%)", width: "clamp(28px, 2.2vw + 14px, 40px)", aspectRatio: "1", borderRadius: "50%", border: "2px solid #ffffff", boxSizing: "border-box", background: `url(${f.src}) center / cover no-repeat`, boxShadow: "var(--shadow-md)" }}></span>
        ))}
      </div>
    );
  }

  function Hero() {
    return (
      <div className="hero-band">
        <GlobePlaceholder />
        <div className="container hero-grid">
          {/* 카피 + 진입 아이콘 */}
          <div className="hero-copy">
            <h1 style={{ fontSize: "var(--text-display)", fontWeight: 600, lineHeight: "var(--text-display--line-height)", letterSpacing: "var(--text-display--letter-spacing)", margin: 0 }}>
              당신의 <span style={{ color: "var(--primary)" }}>해외 커리어</span>가<br />시작되는 곳
            </h1>
            <p style={{ fontSize: "clamp(16px, 1vw + 12px, 20px)", fontWeight: 400, color: "var(--muted-foreground)", margin: 0, lineHeight: 1.6 }}>
              <span style={{ fontWeight: 700, color: "var(--primary)" }}>200+명</span>의 글로벌 멘토들이 여러분을 기다리고 있어요
            </p>
            {/* 진입 4개 — 카드 없음. Desktop: 110px 고정폭 좌측 정렬 / Mobile: fill 균등 */}
            <div className="hero-entries">
              {ENTRIES.map((e) => (
                <a key={e.key} href="#" className="hero-entry">
                  <span className="hero-entry-emoji">{e.emoji}</span>
                  <span className="hero-entry-label">{e.label}</span>
                </a>
              ))}
            </div>
          </div>
          {/* 우측 지구본 자리 확보(데스크톱) — 지구본 본체는 밴드 절대배치 */}
          <div className="hero-spacer"></div>
        </div>
      </div>
    );
  }

  function InterviewSection() {
    const carRef = React.useRef(null);
    const [edges, setEdges] = React.useState({ atStart: true, atEnd: false });
    return (
      <div className="section">
        <div className="container">
          <SectionHeader
            icon="quill-write-02"
            title="멘토의 이야기를 읽어보세요"
            viewAll onViewAll={() => {}}
            carousel
            onPrev={() => carRef.current && carRef.current.scrollPrev()}
            onNext={() => carRef.current && carRef.current.scrollNext()}
            prevDisabled={edges.atStart}
            nextDisabled={edges.atEnd}
            style={{ marginBottom: 20 }}
          />
        </div>
        {/* 캐러셀은 컨테이너 폭 안에서. 카드 1장 단위 스냅(featured/compact 구분 없음, 3장이 같은 크기). */}
        <div className="container">
          <Carousel ref={carRef} snap="card" mode="snap-fit" gap={24} onEdgeChange={setEdges}>
            {INTERVIEWS.map((it, i) => (
              <InterviewCard key={i} href="#" style={{ width: 360 }} {...it} />
            ))}
          </Carousel>
        </div>
      </div>
    );
  }

  function InsightSection() {
    const carRef = React.useRef(null);
    const [edges, setEdges] = React.useState({ atStart: true, atEnd: false });
    return (
      <div className="section">
        <div className="container">
          <SectionHeader
            icon="book-open-01"
            title="놓치면 아까운 "
            titleAccent="멘트리 인사이트"
            viewAll onViewAll={() => {}}
            carousel
            onPrev={() => carRef.current && carRef.current.scrollPrev()}
            onNext={() => carRef.current && carRef.current.scrollNext()}
            prevDisabled={edges.atStart}
            nextDisabled={edges.atEnd}
            style={{ marginBottom: 20 }}
          />
          <Carousel ref={carRef} mode="snap-fit" gap={24} onEdgeChange={setEdges}>
            {ARTICLES.map((a, i) => (
              <ArticlePreview key={i} href="#" style={{ width: 288 }} {...a} />
            ))}
          </Carousel>
        </div>
      </div>
    );
  }

  // 세계지도 섹션 — 이 섹션만 sage-50 톤 킱. 중앙정렬 헤더(개별대응, SectionHeader 아님) + 지도 placeholder.
  function WorldMapSection() {
    return (
      <div style={{ background: "var(--sage-50)" }}>
        <div className="section container" style={{ display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", paddingRight: 24, paddingLeft: 24 }}>
          <span style={{ width: 56, height: 56, borderRadius: "50%", background: "var(--card)", border: "1px solid var(--sage-200)", boxShadow: "var(--card-shadow)", display: "flex", alignItems: "center", justifyContent: "center", color: "var(--primary)", marginBottom: 20 }}>
            <Icon name="globe-02" size={28} />
          </span>
          <h2 style={{ fontSize: "var(--text-h0)", fontWeight: 600, lineHeight: "var(--text-h0--line-height)", letterSpacing: "var(--text-h0--letter-spacing)", margin: 0 }}>
            세계에서 활약하고 있는 <span style={{ color: "var(--primary)" }}>207명</span>의 멘토
          </h2>
          <p style={{ fontSize: "var(--text-h3)", color: "var(--muted-foreground)", margin: "12px 0 24px", lineHeight: 1.6 }}>
            나라를 선택하면 멘토 일람 페이지로 이동해요
          </p>
          <Button variant="primary" size="lg" iconRight="arrow-right-01">멘토 찾기 페이지</Button>
          {/* 세계지도 placeholder */}
          <div style={{ width: "100%", height: 460, marginTop: 40, background: "var(--sage-100)", border: "1px dashed var(--sage-300)", borderRadius: "var(--card-radius)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 8, color: "var(--muted-foreground)" }}>
            <Icon name="globe-02" size={52} style={{ color: "var(--sage-400)" }} />
            <div style={{ fontSize: "var(--text-body)", fontWeight: 600 }}>세계지도 영역</div>
            <div style={{ fontSize: "var(--text-caption)", fontFamily: "ui-monospace, monospace" }}>WebGL · 실제 구현은 Claude Code</div>
          </div>
        </div>
      </div>
    );
  }

  // Mentree Biz CTA — 인스턴스(CtaSection 컴포넌트 아님). blue 서브브랜드 — --biz-* 격리 색.
  // 풀블리드 섹션: 배경(--biz-surface)이 화면 좌우 끝까지, radius 없음(각진). 콘텐츠만 1280 컨테이너.
  function BizCta() {
    return (
      <div style={{ background: "var(--biz-surface)" }}>
        <div className="section">
          <div className="container" style={{ display: "grid", gridTemplateColumns: "1.15fr 0.85fr", gap: 40, alignItems: "center" }}>
            {/* 좌: 카피 + 버튼 2개 */}
            <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-start", gap: 0 }}>
              <span style={{ fontSize: "var(--text-caption)", fontWeight: 700, letterSpacing: "0.04em", color: "var(--biz-primary)", marginBottom: 12 }}>Mentree Biz</span>
              <h2 style={{ fontSize: "var(--text-h0)", fontWeight: 600, lineHeight: "var(--text-h0--line-height)", letterSpacing: "var(--text-h0--letter-spacing)", margin: 0, color: "var(--foreground)" }}>
                해외 진출 기업을 위한<br />비즈니스 서포트 서비스
              </h2>
              <p style={{ fontSize: "var(--text-h3)", color: "var(--muted-foreground)", lineHeight: 1.6, margin: "14px 0 28px" }}>
                현지 경력이 풍부한 각 분야별 전문가가<br />사업의 개별적인 상황에 따른 맞춤형 서포트를 제공합니다
              </p>
              <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                <Button variant="outline" size="lg">자세히 알아보기</Button>
                <Button variant="primary" size="lg" iconRight="sent-02"
                  style={{ background: "var(--biz-primary)", color: "var(--biz-primary-foreground)", border: "1px solid transparent" }}>문의하기</Button>
              </div>
            </div>
            {/* 우: 입고된 SVG 통째로. Claude가 그린 조형 없이 원본 그대로. */}
            <div style={{ display: "flex", alignItems: "center", justifyContent: "center" }}>
              <img src="../../assets/logo/biz.svg" alt="Mentree Biz" style={{ width: 280, height: "auto", display: "block" }} />
            </div>
          </div>
        </div>
      </div>
    );
  }

  function TOP() {
    const [active, setActive] = React.useState(null);
    return (
      <div>
        <Header authState="guest" activeKey={active} onNavigate={(item) => { if (!item.external && item.href && item.href.startsWith("/")) setActive(item.key); }} />
        <Hero />
        <InterviewSection />
        <AiBand />
        <MentorSection />
        <QnaSection />
        <InsightSection />
        <WorldMapSection />
        <BizCta />
        <Footer onNavigate={() => {}} />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<TOP />);
</script>
</body>
</html>
