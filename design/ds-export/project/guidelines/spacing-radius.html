<!-- @dsCard group="Foundations" viewport="700x150" name="라운드 스케일" subtitle="베이스 --radius 14px (Large) — sm … 2xl" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px 22px;background:var(--background);color:var(--foreground);display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
  .u{display:flex;flex-direction:column;align-items:center;gap:8px}
  .box{width:64px;height:64px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-sm)}
  .l{font-size:10.5px;color:var(--muted-foreground)}
</style></head>
<body>
  <div class="u"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="l">sm · 8</div></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-md)"></div><div class="l">md · 12</div></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="l">lg · 14</div></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="l">xl · 20</div></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="l">2xl · 24</div></div>
</body></html>
