<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:14px 16px;background:var(--background);color:var(--foreground)}
  .row{display:flex;align-items:baseline;gap:10px;padding:4px 0;border-bottom:1px solid var(--border)}
  .row:last-child{border:none}
  .tok{width:56px;font-size:10px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
  .meta{margin-left:auto;font-size:10px;color:var(--muted-foreground);font-variant-numeric:tabular-nums;white-space:nowrap}
</style></head>
<body>
  <div class="row"><span class="tok">display</span><span class="text-display">해외 커리어의 시작</span><span class="meta">26 / 34</span></div>
  <div class="row"><span class="tok">h0</span><span class="text-h0">멘토와 함께 성장</span><span class="meta">20 / 28</span></div>
  <div class="row"><span class="tok">h1</span><span class="text-h1">페이지 안 큰 제목</span><span class="meta">20 / 28</span></div>
  <div class="row"><span class="tok">h2</span><span class="text-h2">추천 멘토 3명</span><span class="meta">20(고정)</span></div>
  <div class="row"><span class="tok">h3</span><span class="text-h3">멘토링을 시작해보세요</span><span class="meta">18(고정)</span></div>
  <div class="row"><span class="tok">article</span><span class="text-article">아티클 상세 읽을거리 본문입니다.</span><span class="meta">17(고정)</span></div>
  <div class="row"><span class="tok">body</span><span class="text-body">관심 분야를 선택하세요.</span><span class="meta">16(고정)</span></div>
  <div class="row"><span class="tok">caption</span><span class="text-caption">2026-09-15</span><span class="meta">14(고정)</span></div>
  <div class="row"><span class="tok">micro</span><span class="text-micro">신규</span><span class="meta">12(고정)</span></div>
</body></html>
