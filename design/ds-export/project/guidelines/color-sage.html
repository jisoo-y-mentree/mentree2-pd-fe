<!-- @dsCard group="Foundations" viewport="700x150" name="Sage — 뉴트럴 스케일" subtitle="hue 150, 저채도 — 크롬·텍스트·경계 전체" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:18px 16px;background:var(--background)}
  .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border)}
  .c{flex:1;height:60px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:10px;font-variant-numeric:tabular-nums}
  .labels{display:flex;margin-top:6px}
  .l{flex:1;text-align:center;font-size:10px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
</style></head>
<body>
  <div class="row">
    <div class="c" style="background:var(--sage-50)"></div>
    <div class="c" style="background:var(--sage-100)"></div>
    <div class="c" style="background:var(--sage-200)"></div>
    <div class="c" style="background:var(--sage-300)"></div>
    <div class="c" style="background:var(--sage-400)"></div>
    <div class="c" style="background:var(--sage-500);color:#fff">500</div>
    <div class="c" style="background:var(--sage-600);color:#fff"></div>
    <div class="c" style="background:var(--sage-700);color:#fff"></div>
    <div class="c" style="background:var(--sage-800);color:#fff"></div>
    <div class="c" style="background:var(--sage-900);color:#fff"></div>
    <div class="c" style="background:var(--sage-950);color:#fff"></div>
  </div>
  <div class="labels">
    <div class="l">50</div><div class="l">100</div><div class="l">200</div><div class="l">300</div><div class="l">400</div><div class="l">500</div><div class="l">600</div><div class="l">700</div><div class="l">800</div><div class="l">900</div><div class="l">950</div>
  </div>
</body></html>
