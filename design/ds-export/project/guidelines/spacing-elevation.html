<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px 22px;background:var(--background);color:var(--foreground);display:flex;gap:26px;align-items:center;flex-wrap:wrap}
  .u{display:flex;flex-direction:column;align-items:center;gap:10px}
  .box{width:96px;height:64px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg)}
  .l{font-size:10.5px;color:var(--muted-foreground)}
</style></head>
<body>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="l">shadow-xs</div></div>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="l">shadow-sm · 카드 기본</div></div>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="l">shadow-md</div></div>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="l">shadow-lg · 오버레이</div></div>
</body></html>
