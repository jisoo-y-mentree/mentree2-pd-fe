<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px 22px;background:var(--background);color:var(--foreground);display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
  .u{display:flex;flex-direction:column;align-items:center;gap:6px}
  .bar{background:var(--primary);border-radius:4px;width:20px}
  .l{font-size:10px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
</style></head>
<body>
  <div class="u"><div class="bar" style="height:var(--space-1)"></div><div class="l">1 · 4</div></div>
  <div class="u"><div class="bar" style="height:var(--space-2)"></div><div class="l">2 · 8</div></div>
  <div class="u"><div class="bar" style="height:var(--space-3)"></div><div class="l">3 · 12</div></div>
  <div class="u"><div class="bar" style="height:var(--space-4)"></div><div class="l">4 · 16</div></div>
  <div class="u"><div class="bar" style="height:var(--space-6)"></div><div class="l">6 · 24</div></div>
  <div class="u"><div class="bar" style="height:var(--space-8)"></div><div class="l">8 · 32</div></div>
  <div class="u"><div class="bar" style="height:var(--space-12)"></div><div class="l">12 · 48</div></div>
  <div class="u"><div class="bar" style="height:var(--space-16)"></div><div class="l">16 · 64</div></div>
</body></html>
