<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--background); color: var(--foreground); font-family: var(--font-sans); }
  .stack { display: flex; flex-direction: column; gap: 20px; max-width: 760px; }
  .cap { font-size: var(--text-caption); color: var(--muted-foreground); margin-bottom: 6px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { AnswerCard } = window.MentreeDesignSystem_2f86cf;
  const BODY = "말씀하신 상황이라면 우선 포트폴리오를 재구성하기 전에 타깃 직군을 좁히는 게 먼저입니다. 2년 차라면 아직 방향을 바꿀 수 있는 시기라 성장 정체를 이직으로 해결하려 하기보다, 지금 팀에서 새로운 프로젝트를 요청해보는 것도 방법입니다.";
  const M = { mentorName: "서명진", mentorPhoto: "../../assets/img/1.png", country: "japan", countryLabel: "일본", headline: "데이터 애널리스트 @Google Japan (14년차)", body: BODY, date: "2026-07-04" };
  function Live() {
    const [guest, setGuest] = React.useState(false);
    const [n, setN] = React.useState(18);
    const [mine, setMine] = React.useState(0);
    const [msg, setMsg] = React.useState("");
    const onLike = () => { if (guest) { setMsg("로그인이 필요합니다(토스트 자리)"); return; } setMsg(""); setMine((m) => m + 1); setN((c) => c + 1); };
    return <div>
      <div className="cap" style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
        <span>⓪ DS-116 — 화면이 수를 들고 있다</span>
        <label style={{ display: "inline-flex", gap: 6, alignItems: "center" }}><input type="checkbox" checked={guest} onChange={(e) => setGuest(e.target.checked)} />비로그인</label>
        <span>{msg}</span>
      </div>
      <AnswerCard {...M} likeCount={n} liked={mine > 0} onLike={onLike} />
    </div>;
  }
  function Demo() {
    return (
      <div className="stack">
        <Live />
        <div><div className="cap">① 기본 — 다른 사람이 봄</div><AnswerCard {...M} likeCount={77} /></div>
        <div><div className="cap">② 질문자 시점 · 감사 인사 작성 전 — 「감사인사 작성」</div><AnswerCard {...M} likeCount={77} isQuestionerView onThanks={() => alert("감사인사 모달(화면이 연다)")} /></div>
        <div><div className="cap">③ 도움 표시 ＋ 감사 인사 — 「감사인사 작성」은 숨는다</div><AnswerCard {...M} likeCount={78} liked accepted isQuestionerView thanks={{ author: "김**", date: "2026-07-05", text: "덕분에 지금 팀에서 먼저 새 프로젝트를 요청해 봤어요. 정말 감사합니다!" }} /></div>
        <div><div className="cap">④ 내 답변 — 머리 상자 오른쪽 위 ⋯(수정 · 삭제)</div><AnswerCard {...M} mentorName="Sarah Kim" country="united-states" countryLabel="미국" headline="프로덕트 매니저 @Airbnb (9년차)" likeCount={9} isMine onEdit={() => alert("수정")} onDelete={() => alert("삭제")} /></div>
        <div style={{ maxWidth: 390 }}><div className="cap">좁은 폭(390) — 「멘토 프로필 보기 ›」 아래 줄 · 「감사인사 작성」 다음 줄 전체 폭</div><AnswerCard {...M} likeCount={77} isQuestionerView /></div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
