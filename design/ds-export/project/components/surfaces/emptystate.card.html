<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--background); color: var(--foreground); font-family: var(--font-sans); }
  .row { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .cell { display: flex; flex-direction: column; gap: 8px; }
  .slot { border: 1px dashed var(--sage-200); border-radius: var(--radius-lg); }
  .cap { font-size: var(--text-caption); color: var(--muted-foreground); max-width: 340px; }
  .note { font-size: var(--text-caption); color: var(--muted-foreground); border-top: 1px solid var(--border); padding-top: 14px; margin-top: 22px; line-height: 1.6; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { EmptyState, Button } = window.MentreeDesignSystem_2f86cf;

  function Demo() {
    return (
      <React.Fragment>
        <div className="row">
          <div className="cell">
            <div className="slot" style={{ width: 420 }}>
              <EmptyState
                icon="mentoring"
                title="아직 질문이 없으시네요!"
                description="궁금한 점을 남기면 멘토가 답해 드립니다."
                action={<Button size="sm">질문하기</Button>}
              />
            </div>
            <span className="cap">md — 아이콘+제목+설명+버튼("아직 없다" 문구는 화면이 넘긴다)</span>
          </div>

          <div className="cell">
            <div className="slot" style={{ width: 420 }}>
              <EmptyState title="찾으시는 질문이 없습니다" />
            </div>
            <span className="cap">md — 제목만("찾았는데 없다"). 부품은 두 종류를 구분하지 않는다</span>
          </div>
        </div>

        <div className="row" style={{ marginTop: 20 }}>
          <div className="cell">
            <div className="slot" style={{ width: 260 }}>
              <EmptyState size="sm" icon="search-01" title="새 알림이 없습니다" />
            </div>
            <span className="cap">sm — 좁은 자리(알림 드롭다운). 설명 생략</span>
          </div>

          <div className="cell">
            <div className="slot" style={{ width: 260 }}>
              <EmptyState
                size="sm"
                icon="user-group"
                title="내 질문이 없습니다"
                description="첫 질문을 남겨 보세요."
                action={<Button size="sm" variant="outline">질문하기</Button>}
              />
            </div>
            <span className="cap">sm — 우측 위젯. 설명·액션을 붙여도 좁은 폭에 들어간다</span>
          </div>
        </div>

        <div className="note">
          점선은 들어갈 자리를 보이기 위한 카드 데모 테두리일 뿐 — 부품 자체는 배경·테두리가 없다(카드 셸 미상속).
          채도는 쓰지 않는다(아이콘도 --muted-foreground). 기본 문구는 부품에 없다 — 한/일 2개국어라 화면이 전부 넘긴다.
          액션은 1개까지(배열이 와도 첫 하나만 선다).
        </div>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
