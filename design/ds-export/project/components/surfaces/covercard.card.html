<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
body{margin:0;padding:24px;background:var(--background);color:var(--foreground);font-family:var(--font-sans);}
.sec{display:flex;flex-direction:column;gap:12px;margin-bottom:36px;}
.cap{font-size:var(--text-caption);color:var(--muted-foreground);font-weight:600;}
.narrow{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { CoverCard } = window.MentreeDesignSystem_2f86cf;
const P = (n) => "../../assets/img/" + n + ".png";
const EX = "신졸로 입사해 5년 동안 두 번의 팀 이동과 한 번의 이직을 거쳤습니다. 일본어 면접에서 가장 많이 받은 질문과, 외국인 개발자로서 평가받는 방식이 어떻게 달랐는지 이야기합니다.";
const PEOPLE = [
  { tone: "green", badge: "개발", title: "늦은 출발은 없다! BX 디자이너 커리어 개척기", person: { name: "서명진", country: "japan", countryLabel: "일본", role: "백엔드 개발자", company: "LINE Yahoo" }, img: 1 },
  { tone: "sky", badge: "금융", title: "싱가포르 은행 애널리스트가 말하는 첫 해", person: { name: "Lee Wen", country: "singapore", countryLabel: "싱가포르", role: "Analyst", company: "DBS Bank" }, img: 2 },
  { tone: "rose", badge: "디자인", title: "암스테르담 프로덕트 디자이너의 하루", person: { name: "김하린", country: "netherlands", countryLabel: "네덜란드", role: "Product Designer", company: "Booking.com" }, img: 3 },
  { tone: "gray", badge: "영업/컨설팅", title: "런던 컨설팅 펌, 비자 스폰서십을 받기까지", person: { name: "박도윤", country: "united-kingdom", countryLabel: "영국", role: "Consultant", company: "Deloitte UK" }, img: 4 },
];
function Demo() {
  return (<div>
    <div className="sec"><div className="cap">넓은 판(폭 1040) — 4색 · 사람 있음 · 돌리는 순서 1→4(화면이 정한다)</div>
      {PEOPLE.map((p, i) => <div key={i} style={{ maxWidth: 1040, marginBottom: 16 }}><CoverCard href="#" image={P(p.img)} tone={p.tone} badge={p.badge} title={p.title} excerpt={EX} person={p.person} /></div>)}
    </div>
    <div className="sec"><div className="cap">인사이트 피처드 — 사람 없음 · 꼬리표 「신규 아티클」</div>
      <div style={{ maxWidth: 1040 }}><CoverCard href="#" image={P(8)} tone="sky" badge="취업 전략" label="신규 아티클" title="해외 첫 이직, 오퍼 레터에서 꼭 확인할 다섯 줄" excerpt="연봉 숫자보다 먼저 봐야 할 것이 있습니다. 수습 기간, 비자 비용 부담, 이사 지원, 경업 금지 조항, 그리고 시작일의 유연성입니다." /></div>
    </div>
    <div className="sec"><div className="cap">좁은 판(폭 343 · 600) — 이미지 16:9 위 · 패널 아래</div>
      <div className="narrow">
        <div style={{ width: 343 }}><CoverCard href="#" image={P(1)} {...PEOPLE[0]} excerpt={EX} /></div>
        <div style={{ width: 600 }}><CoverCard href="#" image={P(8)} tone="rose" badge="취업 전략" label="신규 아티클" title="해외 첫 이직, 오퍼 레터에서 꼭 확인할 다섯 줄" excerpt={EX} /></div>
      </div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
