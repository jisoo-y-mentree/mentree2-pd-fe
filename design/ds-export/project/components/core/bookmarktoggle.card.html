<!DOCTYPE html>
<html lang="ko">

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { BookmarkToggle } = window.MentreeDesignSystem_2f86cf;

  function Live({ initial }) {
    const [on, setOn] = React.useState(initial);
    return <BookmarkToggle selected={on} onChange={setOn} />;
  }

  function Demo() {
    return (
      <div className="stack">
        <div className="row">
          <span className="lbl">기본</span>
          <Live initial={false} />
          <Live initial={true} />
          <span className="cap">미선택=outline · 선택=초록(--green-50 + 1px --green-700 + 채운 --green-700)</span>
        </div>
        <div className="row">
          <span className="lbl">disabled</span>
          <BookmarkToggle disabled />
          <BookmarkToggle selected disabled />
        </div>
        <div className="row" style={{ alignItems: "flex-start" }}>
          <span className="lbl">면 위 · 꺼짐/켜짐</span>
          {[["흰 면", "var(--card)"], ["사진", "url(../../assets/img/1.png) center / cover"], ["초록", "var(--primary)"], ["주황", "var(--orange-500)"], ["파랑", "var(--biz-primary)"]].map(([n, bg]) => (
            <div key={n} style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              <div style={{ display: "flex", gap: 8, padding: 10, width: 116, boxSizing: "border-box", justifyContent: "center", borderRadius: "var(--radius-md)", border: "1px solid var(--border)", background: bg }}>
                <BookmarkToggle selected={false} />
                <BookmarkToggle selected />
              </div>
              <span className="cap">{n}</span>
            </div>
          ))}
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
