<!-- @dsCard group="Components" viewport="820x360" name="FilterChip" subtitle="Toggle 계열 텍스트 칩 — BookmarkToggle의 형제. 선택 시 green 반전. leading none/flag" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--background); color: var(--foreground); font-family: var(--font-sans); }
  .stack { display: flex; flex-direction: column; gap: 22px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .lbl { font-size: var(--text-caption); font-weight: 600; color: var(--muted-foreground); width: 92px; flex: 0 0 auto; }
  .cap { font-size: var(--text-caption); color: var(--muted-foreground); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { FilterChip } = window.MentreeDesignSystem_2f86cf;

  function Demo() {
    // 국가(다중 선택) — flag leading
    const [countries, setCountries] = React.useState({ japan: true });
    const toggle = (k) => setCountries((c) => ({ ...c, [k]: !c[k] }));
    // 직무(단일 선택) — none leading
    const [job, setJob] = React.useState("디자인");

    return (
      <div className="stack">
        <div className="row">
          <span className="lbl">국가 · flag</span>
          <FilterChip leading="flag" flag="japan" selected={!!countries.japan} onChange={() => toggle("japan")}>일본</FilterChip>
          <FilterChip leading="flag" flag="united-states" selected={!!countries["united-states"]} onChange={() => toggle("united-states")}>미국</FilterChip>
          <FilterChip leading="flag" flag="south-korea" selected={!!countries["south-korea"]} onChange={() => toggle("south-korea")}>대한민국</FilterChip>
        </div>

        <div className="row">
          <span className="lbl">직무 · none</span>
          {["개발", "디자인", "기획", "데이터"].map((j) => (
            <FilterChip key={j} selected={job === j} onChange={() => setJob(j)}>{j}</FilterChip>
          ))}
        </div>

        <div className="row">
          <span className="lbl">상태 시연</span>
          <FilterChip>default</FilterChip>
          <FilterChip selected>selected(green 반전)</FilterChip>
          <FilterChip disabled>disabled</FilterChip>
          <FilterChip leading="flag" flag="south-korea" selected disabled>selected · disabled</FilterChip>
        </div>
        <div className="cap">국가=다중 토글 · 직무=단일 선택. selected는 green 반전, 국기는 고유색 유지.</div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
