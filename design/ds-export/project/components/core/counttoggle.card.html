<!-- @dsCard group="Components" viewport="820x620" name="CountToggle" subtitle="DS-116 repeat 은 바깥 count 만 따른다(올려 넘김 · 거절) · DS-86 box(48 · IconButton lg와 같은 높이·반경) · DS-23 repeat(누를수록 오름) · 아이콘(+선택적 카운트) 토글 — 도움돼요(rose)·스크랩(dark). count 없이도 세운다(아이콘만). selected는 반전 안 함(아이콘 fill만, green 없음)" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--background); color: var(--foreground); font-family: var(--font-sans); }
  .stack { display: flex; flex-direction: column; gap: 22px; }
  .row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .lbl { font-size: var(--text-caption); font-weight: 600; color: var(--muted-foreground); width: 110px; flex: 0 0 auto; }
  .cap { font-size: var(--text-caption); color: var(--muted-foreground); }
  .note { font-size: var(--text-caption); color: var(--muted-foreground); border-top: 1px solid var(--border); padding-top: 14px; line-height: 1.6; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { CountToggle, IconButton } = window.MentreeDesignSystem_2f86cf;
  function Clap({ initial, pressedTimes = 0 }) {
    const [n, setN] = React.useState(initial + pressedTimes);
    const [mine, setMine] = React.useState(pressedTimes);
    return <span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}>
      <CountToggle appearance="box" repeat icon="favourite" tone="dark" selected={mine > 0} count={n} onIncrement={() => { setMine((m) => m + 1); setN((c) => c + 1); }} />
      <span className="cap">내가 {mine}번</span>
    </span>;
  }

  function Refuse({ initial }) {
    const [tries, setTries] = React.useState(0);
    return <span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}>
      <CountToggle appearance="box" repeat icon="favourite" tone="dark" selected={false} count={initial} onIncrement={() => setTries((t) => t + 1)} />
      <span className="cap">누른 횟수 {tries} · 바깥이 올리지 않음</span>
    </span>;
  }

  function Live({ icon, tone, initial, count }) {
    const [on, setOn] = React.useState(initial);
    const [n, setN] = React.useState(count);
    return <CountToggle icon={icon} tone={tone} selected={on} count={n} onChange={(v) => { setOn(v); setN((c) => (c == null ? c : c + (v ? 1 : -1))); }} />;
  }

  function Demo() {
    return (
      <div className="stack">
        <div className="row">
          <span className="lbl">box · 꺼짐 / 켜짐</span>
          <CountToggle appearance="box" icon="favourite" tone="dark" count={77} />
          <CountToggle appearance="box" icon="favourite" tone="dark" selected count={78} />
          <IconButton variant="outline" size="lg" icon="share-08" ariaLabel="공유" />
          <span className="cap">IconButton lg 와 나란히 — 높이 48 · 반경 12가 같다</span>
        </div>
        <div className="row">
          <span className="lbl">box · repeat</span>
          <Clap initial={77} />
          <Clap initial={77} pressedTimes={3} />
          <span className="cap">바깥이 수를 올려 넘긴다 → +1 · 끄지 않는다 · aria-pressed 없음 · 이름 「도움돼요 N」</span>
        </div>
        <div className="row">
          <span className="lbl">box · repeat · 거절</span>
          <Refuse initial={18} />
          <span className="cap">DS-116 — 비로그인 · 실패 자리. onIncrement 만 오고 count 그대로 → 18 · 채움 없음</span>
        </div>
        <div className="row">
          <span className="lbl">도움돼요 · rose</span>
          <Live icon="favourite" tone="rose" initial={false} count={12} />
          <Live icon="favourite" tone="rose" initial={true} count={13} />
          <span className="cap">클릭하면 카운트도 함께 움직임(로컬 시연)</span>
        </div>

        <div className="row">
          <span className="lbl">스크랩 · dark</span>
          <Live icon="bookmark" tone="dark" initial={false} count={4} />
          <Live icon="bookmark" tone="dark" initial={true} count={5} />
        </div>

        <div className="row">
          <span className="lbl">disabled</span>
          <CountToggle icon="favourite" tone="rose" count={8} disabled />
          <CountToggle icon="bookmark" tone="dark" disabled />
          <CountToggle icon="bookmark" tone="dark" selected count={5} disabled />
        </div>

        <div className="row">
          <span className="lbl">카드 위 조합</span>
          <div style={{ display: "flex", gap: 14, padding: "10px 14px", background: "var(--card)", border: "1px solid var(--border)", borderRadius: "var(--radius-lg)" }}>
            <Live icon="favourite" tone="rose" initial={true} count={41} />
            <Live icon="bookmark" tone="dark" initial={false} count={9} />
          </div>
          <span className="cap">도움돼요=rose · 스크랩=dark — 나란히 놓여도 색으로 갈린다. selected는 반전 아니라 아이콘 fill만.</span>
        </div>

        <div className="note">사진 위 스크랩은 이 부품이 아니라 <b>BookmarkToggle</b>이다(DESIGN.md §8.1).</div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
