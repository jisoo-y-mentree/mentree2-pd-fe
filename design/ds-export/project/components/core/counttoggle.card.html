<!-- @dsCard group="Components" viewport="820x320" name="CountToggle" subtitle="아이콘(+선택적 카운트) 토글 — 도움돼요(rose)·스크랩(dark). count 없이도 세운다(아이콘만). selected는 반전 안 함(아이콘 fill만, green 없음)" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--background); color: var(--foreground); font-family: var(--font-sans); }
  .stack { display: flex; flex-direction: column; gap: 22px; }
  .row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .lbl { font-size: var(--text-caption); font-weight: 600; color: var(--muted-foreground); width: 110px; flex: 0 0 auto; }
  .cap { font-size: var(--text-caption); color: var(--muted-foreground); }
  .note { font-size: var(--text-caption); color: var(--muted-foreground); border-top: 1px solid var(--border); padding-top: 14px; line-height: 1.6; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { CountToggle } = window.MentreeDesignSystem_2f86cf;

  function Live({ icon, tone, initial, count }) {
    const [on, setOn] = React.useState(initial);
    const [n, setN] = React.useState(count);
    return <CountToggle icon={icon} tone={tone} selected={on} count={n} onChange={(v) => { setOn(v); setN((c) => (c == null ? c : c + (v ? 1 : -1))); }} />;
  }

  function Demo() {
    return (
      <div className="stack">
        <div className="row">
          <span className="lbl">도움돼요 · rose</span>
          <Live icon="favourite" tone="rose" initial={false} count={12} />
          <Live icon="favourite" tone="rose" initial={true} count={13} />
          <span className="cap">클릭하면 카운트도 함께 움직임(로컬 시연)</span>
        </div>

        <div className="row">
          <span className="lbl">스크랩 · dark</span>
          <Live icon="bookmark" tone="dark" initial={false} count={4} />
          <Live icon="bookmark" tone="dark" initial={true} count={5} />
        </div>

        <div className="row">
          <span className="lbl">count 없음</span>
          <Live icon="bookmark" tone="dark" initial={false} />
          <Live icon="bookmark" tone="dark" initial={true} />
          <Live icon="favourite" tone="rose" initial={true} />
          <span className="cap">count를 넘기지 않으면 아이콘만 — 카드 미디어 오버레이의 스크랩이 이 형태</span>
        </div>

        <div className="row">
          <span className="lbl">사진 위 오버레이</span>
          <div style={{ position: "relative", width: 180, height: 110, borderRadius: "var(--radius-md)", overflow: "hidden", background: "linear-gradient(135deg, var(--sage-400), var(--sage-700))" }}>
            <div style={{ position: "absolute", top: 8, right: 8, display: "inline-flex", padding: "2px 4px", borderRadius: "var(--radius-md)", background: "color-mix(in oklch, white 82%, transparent)", backdropFilter: "blur(4px)", boxShadow: "var(--shadow-sm), 0 0 0 1px color-mix(in oklch, var(--sage-950) 6%, transparent)" }}>
              <Live icon="bookmark" tone="dark" initial={false} />
            </div>
          </div>
          <span className="cap">배경이 없으므로 사진 위에서는 반투명 받침 + 그림자로 읽히게 한다(반전으로 되돌리지 않는다)</span>
        </div>

        <div className="row">
          <span className="lbl">disabled</span>
          <CountToggle icon="favourite" tone="rose" count={8} disabled />
          <CountToggle icon="bookmark" tone="dark" disabled />
          <CountToggle icon="bookmark" tone="dark" selected count={5} disabled />
        </div>

        <div className="row">
          <span className="lbl">카드 위 조합</span>
          <div style={{ display: "flex", gap: 14, padding: "10px 14px", background: "var(--card)", border: "1px solid var(--border)", borderRadius: "var(--radius-lg)" }}>
            <Live icon="favourite" tone="rose" initial={true} count={41} />
            <Live icon="bookmark" tone="dark" initial={false} count={9} />
          </div>
          <span className="cap">도움돼요=rose · 스크랩=dark — 나란히 놓여도 색으로 갈린다. selected는 반전 아니라 아이콘 fill만.</span>
        </div>

        <div className="note">
          스크랩의 선택 표현은 전 화면에서 이 하나다(2026-09-11, 옛 아이콘 전용 토글을 흡수) — 카운트가 있든 없든 배경을 채우는 반전은 쓰지 않고
          아이콘 fill + tone 색으로만 표시한다. green은 쓰지 않음(다른 의미로 이미 쓰임).
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
