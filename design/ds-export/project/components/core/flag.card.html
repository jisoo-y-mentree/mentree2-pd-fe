<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
body{margin:0;padding:var(--space-6);background:var(--background);color:var(--foreground);font-family:var(--font-sans);}
.sec{display:flex;flex-direction:column;gap:var(--space-3);margin-bottom:var(--space-8);}
.lbl{font-size:var(--text-caption);line-height:var(--text-caption--line-height);font-weight:600;color:var(--muted-foreground);}
.items{display:flex;align-items:center;gap:var(--space-6);flex-wrap:wrap;}
.cell{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);}
.cap{font-size:var(--text-micro);color:var(--muted-foreground);}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Flag } = window.MentreeDesignSystem_2f86cf;
function Demo() {
  const f = React.useRef(null);
  React.useEffect(() => { const el = f.current && f.current.querySelector(".mt-flag"); if (el) el.focus({ preventScroll: true }); }, []);
  return (<div>
    <div className="sec"><div className="lbl">크기 — sm 16 · md 20 · lg 24 · xl 28</div>
      <div className="items">{["sm","md","lg","xl"].map((s) => <div className="cell" key={s}><Flag country="united-states" label="미국" size={s} /><span className="cap">{s}</span></div>)}</div></div>
    <div className="sec"><div className="lbl">흰 면이 많은 국기 — 1px --border 링으로 흰 바탕에 묻히지 않는다</div>
      <div className="items">
        <div className="cell"><Flag country="japan" label="일본" size="xl" /><span className="cap">일본 xl</span></div>
        <div className="cell"><Flag country="south-korea" label="대한민국" size="xl" /><span className="cap">대한민국 xl</span></div>
        <div className="cell"><Flag country="switzerland" label="스위스" size="xl" /><span className="cap">스위스 xl</span></div>
      </div></div>
    <div className="sec"><div className="lbl">이름 — 도시 있음「일본 · 도쿄」 / 없음「네덜란드」 · 툴팁 열림(키보드 포커스)</div>
      <div ref={f} className="items" style={{ paddingTop: 36 }}>
        <div className="cell"><Flag country="japan" label="일본" city="도쿄" size="lg" /><span className="cap">aria-label 일본 · 도쿄</span></div>
        <div className="cell"><Flag country="netherlands" label="네덜란드" size="lg" /><span className="cap">aria-label 네덜란드</span></div>
      </div></div>
    <div className="sec"><div className="lbl">--text-display 이름 오른쪽에 xl — 글자의 세로 가운데</div>
      <div style={{ display: "flex", alignItems: "center", gap: "var(--space-2)" }}>
        <span style={{ fontSize: "var(--text-display)", lineHeight: "var(--text-display--line-height)", letterSpacing: "var(--text-display--letter-spacing)", fontWeight: 600 }}>박서연</span>
        <Flag country="japan" label="일본" city="도쿄" size="xl" />
      </div></div>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
