<!-- @dsCard group="Components" viewport="820x240" name="BookmarkToggle" subtitle="Toggle 기반 아이콘 토글 — default·hover·active·selected·focus·disabled [Toggle/IconButton]" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--background); color: var(--foreground); font-family: var(--font-sans); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 22px 20px; }
  .grid { display: flex; align-items: flex-start; gap: 26px; flex-wrap: wrap; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .cap { font-size: 11px; color: var(--muted-foreground); }
  .btn { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: var(--radius-md); }
  .divider { width: 1px; align-self: stretch; background: var(--border); }
  .live { font-size: 10.5px; color: var(--muted-foreground); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const NS = window.MentreeDesignSystem_2f86cf;
  const { BookmarkToggle } = NS;

  const Mark = ({ fill }) => (
    <svg width="20" height="20" viewBox="0 0 24 24" fill={fill ? "currentColor" : "none"} stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round">
      <path d="M5 4.6C5 3.72 5.72 3 6.6 3h10.8c.88 0 1.6.72 1.6 1.6v15.5c0 .82-.92 1.3-1.58.82L12 17.4l-5.42 3.52C5.92 21.4 5 20.92 5 20.1V4.6z" />
    </svg>
  );
  // 정적 상태 견본 (hover·active·focus는 강제 불가라 시각 재현)
  const specimens = [
    { cap: "default",       s: { background: "transparent", color: "var(--muted-foreground)" }, fill: false },
    { cap: "hover",         s: { background: "var(--secondary)", color: "var(--muted-foreground)" }, fill: false },
    { cap: "active",        s: { background: "var(--secondary)", color: "var(--muted-foreground)", transform: "translateY(0.5px)" }, fill: false },
    { cap: "selected",      s: { background: "var(--sage-900)", color: "var(--sage-50)" }, fill: true },
    { cap: "focus-visible", s: { background: "transparent", color: "var(--muted-foreground)", outline: "2px solid var(--ring)", outlineOffset: "2px" }, fill: false },
    { cap: "disabled",      s: { background: "transparent", color: "var(--sage-400)", opacity: 0.55 }, fill: false },
  ];

  function Live() {
    const [on, setOn] = React.useState(false);
    return (
      <div className="cell">
        <BookmarkToggle selected={on} onChange={setOn} />
        <span className="live">실제 (클릭)</span>
      </div>
    );
  }

  function Demo() {
    return (
      <div className="card">
        <div className="grid">
          {specimens.map((sp) => (
            <div className="cell" key={sp.cap}>
              <span className="btn" style={sp.s}><Mark fill={sp.fill} /></span>
              <span className="cap">{sp.cap}</span>
            </div>
          ))}
          <div className="divider" />
          <Live />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
