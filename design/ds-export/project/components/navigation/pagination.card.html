<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--background); color: var(--foreground); font-family: var(--font-sans); }
  .cell { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
  .cap { font-size: var(--text-caption); color: var(--muted-foreground); }
  .frame { border: 1px dashed var(--sage-200); border-radius: var(--radius-lg); padding: 12px 8px; }
  .mobile { width: 390px; }
  .note { font-size: var(--text-caption); color: var(--muted-foreground); border-top: 1px solid var(--border); padding-top: 14px; margin-top: 6px; line-height: 1.6; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Pagination } = window.MentreeDesignSystem_2f86cf;

  function Demo() {
    const [page, setPage] = React.useState(7);
    return (
      <React.Fragment>
        <div className="cell">
          <span className="cap">시작 — 1 2 3 4 5 6 7 … 30 « »  (와이어의 시작형, 현재 5)</span>
          <div className="frame"><Pagination page={5} totalPages={30} onPageChange={() => {}} /></div>
        </div>

        <div className="cell">
          <span className="cap">중간 — 1 … 5 6 [7] 8 9 … 30 « »  (「1 … 현재±2 … 끝」)</span>
          <div className="frame"><Pagination page={7} totalPages={30} onPageChange={() => {}} /></div>
        </div>

        <div className="cell">
          <span className="cap">끝 — 1 … 25 26 27 28 29 30 « »  (와이어의 끝형, 현재 27)</span>
          <div className="frame"><Pagination page={27} totalPages={30} onPageChange={() => {}} /></div>
        </div>

        <div className="cell">
          <span className="cap">양 끝 — 1페이지에서 « 비활성 / 마지막에서 » 비활성 (와이어에 그림이 없어 여기서 정한 것)</span>
          <div className="frame"><Pagination page={1} totalPages={30} onPageChange={() => {}} /></div>
          <div className="frame"><Pagination page={30} totalPages={30} onPageChange={() => {}} /></div>
        </div>

        <div className="cell">
          <span className="cap">접을 게 없을 때 — 총 5페이지. 「…」이 1페이지만 가리면 그 번호를 세운다(총 8페이지·현재 4)</span>
          <div className="frame"><Pagination page={3} totalPages={5} onPageChange={() => {}} /></div>
          <div className="frame"><Pagination page={4} totalPages={8} onPageChange={() => {}} /></div>
        </div>

        <div className="cell">
          <span className="cap">제어형 — 눌러 보세요(현재 {page} / 30). 현재 페이지는 눌러도 아무 일이 없다</span>
          <div className="frame"><Pagination page={page} totalPages={30} onPageChange={setPage} /></div>
        </div>

        <div className="cell">
          <span className="cap">모바일 390px — 양옆 ±1로 줄고 « » 는 남는다(와이어 근거 없음, 여기서 정한 것). 이 카드는 데스크톱 폭이라 ±2로 보일 수 있습니다 — 실제 판정은 뷰포트 768 이하에서</span>
          <div className="frame mobile"><Pagination page={7} totalPages={30} onPageChange={() => {}} /></div>
        </div>

        <div className="note">
          « » 는 둘 다 마지막 번호 뒤에 나란히 선다 — « 를 왼쪽 끝에 두지 않는다. 이전·다음(‹ ›)은 없다.
          보이는 사각형은 40이지만 누르는 면은 44x44다. 숫자는 tabular — 자릿수가 바뀌어도 폭이 흔들리지 않는다.
          제어형이므로 컴포넌트가 스스로 페이지를 바꾸지 않는다(URL에 page를 담는 화면이 있다).
        </div>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
