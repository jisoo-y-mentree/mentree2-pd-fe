<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
html,body{margin:0}
body{background:var(--sage-50);font-family:var(--font-sans);color:var(--foreground);padding:24px}
.grid{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:24px;max-width:100%}
.cell{display:flex;flex-direction:column;gap:8px;max-width:100%;overflow-x:auto}
.cap{font-size:var(--text-caption);line-height:var(--text-caption--line-height);color:var(--muted-foreground);max-width:390px}
iframe{display:block;width:390px;box-sizing:content-box;border:0;outline:1px solid var(--sage-200);border-radius:var(--radius-md);background:var(--background)}
@media (max-width:480px){body{padding:24px 0}.cap{padding:0 16px}}
</style>
</head>
<body>
<div class="grid">
<div class="col">
<div class="cell"><div class="cap">① 지금 모양 — accessory 없음 · 56 + safe-area</div><iframe src="bottomtabbar.demo.html?state=1" style="height:200px" title="BottomTabBar 기본"></iframe></div>
<div class="cell"><div class="cap">② accessory — Button primary lg(남은 폭) + IconButton pressed(북마크) + IconButton(공유) · 칸 여백 8/16</div><iframe src="bottomtabbar.demo.html?state=2" style="height:240px" title="BottomTabBar accessory"></iframe></div>
<div class="cell"><div class="cap">③ 숨은 모양 — 컨테이너 56px 아래 · accessory만 바닥 · 탭 줄 inert</div><iframe src="bottomtabbar.demo.html?state=3" style="height:240px" title="BottomTabBar 숨김"></iframe></div>
</div>
<div class="cell"><div class="cap">④ 390 폰 틀 스크롤 데모 — scrollContainer · 아래로 숨고 위로 나온다</div><iframe src="bottomtabbar.demo.html?state=4" style="height:760px" title="BottomTabBar 스크롤 데모"></iframe></div>
</div>
</body>
</html>
