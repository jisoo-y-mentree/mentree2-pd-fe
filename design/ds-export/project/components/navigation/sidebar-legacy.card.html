<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { padding: 0; background: var(--background); }
  .banner { padding: 8px 14px; font-size: var(--text-caption); color: var(--muted-foreground); background: var(--secondary); border-bottom: 1px solid var(--border); }
  .frame { display: flex; height: 380px; }

<body>
<div class="banner">⚠ 참조용 · 레거시 — 이 제품은 사이드바를 기본 네비게이션으로 쓰지 않습니다. (canon: 상단 헤더 + 푸터)</div>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const NS = window.MentreeDesignSystem_2f86cf;
  const { Sidebar, Icon } = NS;
  function Demo() {
    const [route, setRoute] = React.useState("sessions");
    return (
      <div className="frame">
        <Sidebar
          active={route} onSelect={setRoute}
          header={<img src="../../assets/logo/mentree-logo.svg" height="22" alt="mentree" />}
          items={[
            { key:"home", label:"홈", icon:"home-01" },
            { key:"sessions", label:"멘토링", icon:"mentoring", badge:3, section:"활동" },
            { key:"mentors", label:"멘토 찾기", icon:"user-group", section:"활동" },
            { key:"calendar", label:"일정", icon:"calendar-03", section:"활동" },
            { key:"messages", label:"메시지", icon:"message-01", badge:12, section:"소통" },
            { key:"resources", label:"학습 자료", icon:"book-open-01", section:"소통" },
            { key:"settings", label:"설정", icon:"settings-01", section:"계정" },
          ]}
          footer={
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:30,height:30,borderRadius:"50%",background:"var(--sage-200)",display:"flex",alignItems:"center",justifyContent:"center"}}>
                <Icon name="user" size={17} style={{color:"var(--sage-600)"}} />
              </div>
              <div style={{lineHeight:1.3}}>
                <div style={{fontSize:"var(--text-caption)",fontWeight:600}}>박지훈</div>
                <div style={{fontSize:11,color:"var(--muted-foreground)"}}>멘티</div>
              </div>
            </div>
          }
        />
        <div className="stage">
          <div style={{fontSize:"var(--text-h2)",fontWeight:600}}>멘토링</div>
          <div style={{color:"var(--muted-foreground)"}}>선택된 항목: {route}</div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
