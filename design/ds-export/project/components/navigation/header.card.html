<script type="text/babel">
  const { Header } = window.MentreeDesignSystem_2f86cf;
  function Demo() {
    const [active, setActive] = React.useState("mentors");
    const nav = (item) => { if (!item.external && item.href && item.href.startsWith("/")) setActive(item.key); };
    return (
      <div>
        <div className="cap">비로그인(guest) — 활성: 멘토 찾기. 우측: 회원가입/로그인(green 하나) + 기업 서비스(파랑 아웃라인 ↗)</div>

        <div className="stage">중앙 메뉴 3개, 각 좌측 28px 컬러 아이콘 슬롯(placeholder — 오리지널 컬러 SVG 예정). 활성 메뉴는 primary green.</div>

        <div className="cap">로그인 상태 분기 — mentor / mentee (분기 자리만, 미구현 placeholder)</div>
        <Header activeKey="qna" authState="mentor" onNavigate={nav} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
