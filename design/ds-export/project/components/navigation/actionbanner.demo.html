<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<style>
html,body{margin:0}
body{background:var(--background);font-family:var(--font-sans);color:var(--foreground)}
.col{display:flex;flex-direction:column;gap:16px;padding:24px var(--container-pad)}
.cap{font-size:var(--text-caption);color:var(--muted-foreground)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { ActionBanner } = window.MentreeDesignSystem_2f86cf;
  const nav = (e) => e.preventDefault();
  function Demo() {
    return (
      <div className="col">
        <div className="cap">layout="inline" — 768 이하에서 stacked로</div>
        <ActionBanner title="일본 취업, 현직 멘토에게 직접 물어보세요" actionLabel="멘토 찾기" href="#" onAction={nav} />
        <div className="cap">layout="stacked"</div>
        <ActionBanner layout="stacked" title="이 멘토와 직접 이야기 나누고 싶나요?" description="1:1 멘토링을 통해 자세한 커리어 히스토리와 본인의 고민거리를 물어보세요." actionLabel="1:1 멘토링 신청하기" onAction={nav} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  const post = () => parent.postMessage({ mtDemo: location.pathname + location.search, h: document.body.scrollHeight }, "*");
  new ResizeObserver(post).observe(document.body);
</script>
</body>
</html>
