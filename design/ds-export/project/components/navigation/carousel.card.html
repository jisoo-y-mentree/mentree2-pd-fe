<!-- @dsCard group="Components" viewport="900x1240" name="Carousel" subtitle="범용 스크롤/스냅 컨테이너 — SectionHeader 화살표와 조합. 카드 종류 무관, gap 주입" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--background); color: var(--foreground); font-family: var(--font-sans); }
  .wrap { display: flex; flex-direction: column; gap: 16px; }
  .cap { font-size: var(--text-caption); color: var(--muted-foreground); }
  /* 데모 카드 — 실제 카드 대신 폭만 가진 대표 박스 */
  .demo-card { width: 240px; height: 150px; background: var(--card); border: 1px solid var(--sage-200); border-radius: var(--card-radius); box-shadow: var(--card-shadow); display: flex; align-items: center; justify-content: center; font-size: var(--text-h2); font-weight: 600; color: var(--sage-400); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Carousel, SectionHeader } = window.MentreeDesignSystem_2f86cf;
  // DS-101 — 1장씩: 카드 폭 100% · 페이드 없음
  function Single() {
    const car = React.useRef(null);
    const [edges, setEdges] = React.useState({ atStart: true, atEnd: false });
    return (
      <div className="wrap">
        <SectionHeader title="멘토의 이야기" carousel onPrev={() => car.current && car.current.scrollPrev()} onNext={() => car.current && car.current.scrollNext()} prevDisabled={edges.atStart} nextDisabled={edges.atEnd} />
        <Carousel ref={car} gap={16} onEdgeChange={setEdges}>
          {[1, 2, 3].map((n) => <div className="demo-card" key={n} style={{ width: "100%", height: 200 }}>{n} / 3</div>)}
        </Carousel>
        <div className="cap">DS-101 · 1장씩(카드 폭 100% × 3) — 넘쳐도 양쪽 페이드 없음 · ← → 버튼 아래 테두리 그대로</div>
      </div>
    );
  }
  // DS-106 — 화면과 같은 조건: 카드마다 display:contents 감싸개
  function Wrapped() {
    const car = React.useRef(null);
    const [edges, setEdges] = React.useState({ atStart: true, atEnd: false });
    const [moved, setMoved] = React.useState(null);
    const next = () => {
      const tr = car.current && document.querySelector("#wrapped-car > div > div");
      const x0 = tr ? tr.scrollLeft : 0;
      car.current && car.current.scrollNext();
      setTimeout(() => { if (tr) { const card = tr.querySelector(".demo-card"); setMoved({ d: Math.round(tr.scrollLeft - x0), w: Math.round(card.getBoundingClientRect().width) }); } }, 700);
    };
    return (
      <div className="wrap">
        <SectionHeader title="감싸개 · 1장씩" carousel onPrev={() => car.current && car.current.scrollPrev()} onNext={next} prevDisabled={edges.atStart} nextDisabled={edges.atEnd} />
        <div id="wrapped-car">
          <Carousel ref={car} gap={16} onEdgeChange={setEdges}>
            {[1, 2, 3].map((n) => <div key={n} style={{ display: "contents" }}><div className="demo-card" style={{ width: "100%", height: 200 }}>{n} / 3</div></div>)}
          </Carousel>
        </div>
        <div className="cap">DS-106 · 카드마다 display:contents 감싸개 — 첫 실물 카드 폭으로 판정 → 페이드 없음 · → 한 번에 1장{moved ? ` (이동 ${moved.d}px · 카드 ${moved.w}px + gap 16)` : ""}</div>
      </div>
    );
  }
  function NoFade() {
    return (
      <div className="wrap">
        <Carousel gap={16} mode="peek" fade={false}>
          {Array.from({ length: 6 }).map((_, i) => <div className="demo-card" key={i} style={{ width: 296 }}>{i + 1}</div>)}
        </Carousel>
        <div className="cap">DS-106 · fade={"{false}"} · peek · 296 × 6 — 넘쳐도 페이드 없음</div>
      </div>
    );
  }
  function Demo() {
    const car = React.useRef(null);
    const [edges, setEdges] = React.useState({ atStart: true, atEnd: false });
    return (
      <div className="wrap">
        <SectionHeader
          title="이달의 인터뷰"
          carousel
          onPrev={() => car.current && car.current.scrollPrev()}
          onNext={() => car.current && car.current.scrollNext()}
          prevDisabled={edges.atStart}
          nextDisabled={edges.atEnd}
        />
        <Carousel ref={car} gap={16} onEdgeChange={setEdges}>
          {Array.from({ length: 8 }).map((_, i) => (
            <div className="demo-card" key={i}>{i + 1}</div>
          ))}
        </Carousel>
        <div className="cap">여러 장(snap-fit · 240) — 화살표(SectionHeader)로 1단위 이동 · 자유 스크롤 · 카드 스냅 · 끝에서 화살표 disabled · 페이드 그대로</div>
        <div style={{ height: 24 }} />
        <Single />
        <div style={{ height: 24 }} />
        <Wrapped />
        <div style={{ height: 24 }} />
        <NoFade />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
