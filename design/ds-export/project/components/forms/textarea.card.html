<!-- @dsCard group="Components" viewport="1280x900" name="Textarea · Input limit" subtitle="DS-70 여러 줄 입력 — rows 3→maxRows 8 자동 높이 · limit 글자 수(넘치면 invalid, 잘라내지 않음) · Input에도 같은 limit" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<style>
html,body{margin:0}
body{padding:24px;background:var(--background);font-family:var(--font-sans);color:var(--foreground)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:28px 32px;align-items:start}
.cell{display:flex;flex-direction:column;gap:10px;min-width:0}
.label{font-size:var(--text-micro);line-height:var(--text-micro--line-height);letter-spacing:var(--text-micro--letter-spacing);font-weight:600;color:var(--muted-foreground)}
@media (max-width:480px){body{padding:20px 16px}}

</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">

  const { Textarea, Input, Field } = window.MentreeDesignSystem_2f86cf;
  const fill = (n, base) => { let s = ""; while (s.length < n) s += base; return s.slice(0, n); };
  const SENT = "현지 취업 준비 과정에서 겪은 시행착오와 비자, 면접, 네트워킹 경험을 나눕니다. ";
  const LONG = Array.from({ length: 12 }, (_, i) => (i + 1) + "번째 줄 — " + SENT.slice(0, 18)).join("\n");
  function T({ init = "", ...p }) { const [v, setV] = React.useState(init); return <Textarea value={v} onChange={(e) => setV(e.target.value)} {...p} />; }
  function I({ init = "", ...p }) { const [v, setV] = React.useState(init); return <Input value={v} onChange={(e) => setV(e.target.value)} {...p} />; }
  function Demo() {
    return (
      <div className="grid">
        <div className="cell"><div className="label">빈 칸 · rows 3</div><Field label="소개글" htmlFor="t1"><T id="t1" placeholder="멘토님을 소개해주세요." /></Field></div>
        <div className="cell"><div className="label">세 줄</div><Field label="답변" htmlFor="t2"><T id="t2" init={"첫 번째 줄입니다.\n두 번째 줄입니다.\n세 번째 줄입니다."} /></Field></div>
        <div className="cell"><div className="label">여덟 줄을 넘김 — 상자 안에서 스크롤</div><Field label="답변" htmlFor="t3"><T id="t3" init={LONG} /></Field></div>
        <div className="cell"><div className="label">limit 500 · 243/500</div><Field label="소개글" htmlFor="t4"><T id="t4" limit={500} init={fill(243, SENT)} /></Field></div>
        <div className="cell"><div className="label">넘침 · 512/500 — 카운터 destructive · invalid · aria-invalid</div><Field label="소개글" htmlFor="t5"><T id="t5" limit={500} init={fill(512, SENT)} /></Field></div>
        <div className="cell"><div className="label">disabled</div><Field label="소개글" htmlFor="t6"><T id="t6" disabled init="수정할 수 없는 소개글입니다." /></Field></div>
        <div className="cell"><div className="label">Input limit 20 — 한도 안</div><Field label="한 줄 요약" htmlFor="i1"><I id="i1" limit={20} init="UX 리서처" /></Field></div>
        <div className="cell"><div className="label">Input 넘침 — 카운터 destructive · invalid</div><Field label="한 줄 요약" htmlFor="i2"><I id="i2" limit={20} init="암스테르담에서 일하는 시니어 프로덕트 디자이너" /></Field></div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
