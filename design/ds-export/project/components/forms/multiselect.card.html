<!-- @dsCard group="Components" viewport="1280x820" name="MultiSelect" subtitle="DS-71 여러 개를 고르는 셀렉트 — 트리거 위 Chip 줄 · 항목을 눌러도 닫히지 않음 · groups(taxonomy) 묶음 제목 · listbox aria-multiselectable" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<style>
html,body{margin:0}
body{padding:24px;background:var(--background);font-family:var(--font-sans);color:var(--foreground)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:28px 32px;align-items:start}
.cell{display:flex;flex-direction:column;gap:10px;min-width:0}
.label{font-size:var(--text-micro);line-height:var(--text-micro--line-height);letter-spacing:var(--text-micro--letter-spacing);font-weight:600;color:var(--muted-foreground)}
@media (max-width:480px){body{padding:20px 16px}}
.open-cell{min-height:420px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">

  const NS = window.MentreeDesignSystem_2f86cf;
  const { MultiSelect, Field, COUNTRY_GROUPS, KEYWORD_GROUPS } = NS;
  function M({ init = [], ...p }) { const [v, setV] = React.useState(init); return <MultiSelect value={v} onChange={setV} {...p} />; }
  const PH = "경험 국가를 선택해주세요.";
  function Demo() {
    React.useEffect(() => { const t = setTimeout(() => { const b = document.getElementById("ms-open"); if (b) b.click(); }, 300); return () => clearTimeout(t); }, []);
    return (
      <div className="grid">
        <div className="cell"><div className="label">빈 칸</div><Field label="커리어 경험이 있는 국가" htmlFor="ms1"><M id="ms1" groups={COUNTRY_GROUPS} placeholder={PH} /></Field></div>
        <div className="cell"><div className="label">3개 고름</div><Field label="커리어 경험이 있는 국가" htmlFor="ms2"><M id="ms2" groups={COUNTRY_GROUPS} placeholder={PH} init={["대한민국", "일본", "미국"]} /></Field></div>
        <div className="cell"><div className="label">칩이 두 줄로 접힘</div><Field label="인사이트 태그" htmlFor="ms3"><M id="ms3" groups={KEYWORD_GROUPS} placeholder="태그를 선택해주세요." init={KEYWORD_GROUPS.flatMap(g => g.options.map(o => o.value)).slice(0, 7)} /></Field></div>
        <div className="cell open-cell"><div className="label">목록 열림 · 묶음 있음 — 눌러도 닫히지 않는다</div><Field label="커리어 경험이 있는 국가" htmlFor="ms-open"><M id="ms-open" groups={COUNTRY_GROUPS} placeholder={PH} init={["일본", "독일"]} /></Field></div>
        <div className="cell"><div className="label">invalid</div><Field label="커리어 경험이 있는 국가" htmlFor="ms5" error="한 개 이상 선택해주세요." required><M id="ms5" groups={COUNTRY_GROUPS} placeholder={PH} invalid /></Field></div>
        <div className="cell"><div className="label">disabled</div><Field label="커리어 경험이 있는 국가" htmlFor="ms6"><M id="ms6" groups={COUNTRY_GROUPS} placeholder={PH} disabled init={["싱가포르"]} /></Field></div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
