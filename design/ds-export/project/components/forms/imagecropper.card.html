<!-- @dsCard group="Components" viewport="1280x760" name="ImageCropper" subtitle="DS-72 사진 한 장에서 원형(아바타) + 직사각형(3:2) — 직사각형 좌우 · 원 상하 · 1〜3배 · ↻ 90° · 키보드" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<style>
html,body{margin:0}
body{padding:24px;background:var(--background);font-family:var(--font-sans);color:var(--foreground)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:28px 32px;align-items:start}
.cell{display:flex;flex-direction:column;gap:10px;min-width:0}
.label{font-size:var(--text-micro);line-height:var(--text-micro--line-height);letter-spacing:var(--text-micro--letter-spacing);font-weight:600;color:var(--muted-foreground)}
@media (max-width:480px){body{padding:20px 16px}}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr))}.readout{font-family:var(--font-mono,monospace);font-size:var(--text-micro);line-height:var(--text-micro--line-height);color:var(--muted-foreground);word-break:break-all}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">

  const { ImageCropper } = window.MentreeDesignSystem_2f86cf;
  const PHOTO = "../../assets/img/1.png";
  function C({ init = PHOTO, value, error, show }) {
    const [src, setSrc] = React.useState(init);
    const [v, setV] = React.useState(null);
    return (
      <React.Fragment>
        <ImageCropper src={src} value={value} error={error} onChange={setV} onRemove={() => setSrc(null)} onPick={(f) => setSrc(URL.createObjectURL(f))} />
        {show && v && <div className="readout">rect {v.rect.x},{v.rect.y} {v.rect.w}×{v.rect.h} · circle {v.circle.cx},{v.circle.cy} r{v.circle.r} · zoom {v.zoom} · {v.rotation}°</div>}
      </React.Fragment>
    );
  }
  function Demo() {
    return (
      <div className="grid">
        <div className="cell"><div className="label">빈 상태 — 사진 올리기 · 끌어다 놓기</div><C init={null} /></div>
        <div className="cell"><div className="label">사진 있음 — 직사각형 좌우 · 원 상하로 끈다</div><C show /></div>
        <div className="cell"><div className="label">확대 2배 — 영역 크기는 그대로</div><C value={{ zoom: 2 }} show /></div>
        <div className="cell"><div className="label">90° 회전</div><C value={{ rotation: 90 }} show /></div>
        <div className="cell"><div className="label">올리기 실패 문구</div><C init={null} error="사진을 올리지 못했습니다. 10MB 이하의 JPG · PNG로 다시 시도해주세요." /></div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
