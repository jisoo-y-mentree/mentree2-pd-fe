<!-- @dsCard group="Components" viewport="640x460" name="SearchInput" subtitle="자동완성·최근 검색어 검색창 — TagInput과 같은 골격, 제안 줄만 상자 밖 드롭다운. 최근검색어↔자동완성 갈아끼움" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--background); color: var(--foreground); font-family: var(--font-sans); }
  .stack { display: flex; flex-direction: column; gap: 36px; max-width: 420px; }
  .cell { display: flex; flex-direction: column; gap: 8px; }
  .lbl { font-size: var(--text-caption); font-weight: 600; color: var(--muted-foreground); }
  .cap { font-size: var(--text-caption); color: var(--muted-foreground); line-height: 1.6; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { SearchInput } = window.MentreeDesignSystem_2f86cf;
  const ALL = ["일본어 통역", "일본 취업", "일본 워킹홀리데이", "한국 IT 이직", "미국 대학원", "UX 디자이너", "백엔드 개발자"];

  function Demo() {
    const [q1, setQ1] = React.useState("");
    const [q2, setQ2] = React.useState("");
    const [q3, setQ3] = React.useState("일본");
    const [recent, setRecent] = React.useState(["일본 취업", "UX 디자이너", "백엔드 개발자"]);

    const completions = ALL.filter((t) => t.includes(q3));

    return (
      <div className="stack">
        <div className="cell">
          <span className="lbl">① 비어 있고 닫힘</span>
          <SearchInput value={q1} onChange={setQ1} onSearch={() => {}} recent={recent} onRemoveRecent={(r) => setRecent(recent.filter((x) => x !== r))} />
        </div>
        <div className="cell">
          <span className="lbl">② 포커스 + 최근 검색어 3개</span>
          <SearchInput autoFocus value={q2} onChange={setQ2} onSearch={() => {}} recent={recent} onRemoveRecent={(r) => setRecent(recent.filter((x) => x !== r))} />
        </div>
        <div className="cell">
          <span className="lbl">③ 입력 중 + 자동완성 3건(일치 강조)</span>
          <SearchInput autoFocus value={q3} onChange={setQ3} onSearch={() => {}} completions={completions.slice(0, 3)} recent={recent} />
        </div>
        <div className="cap">최근 검색어와 자동완성은 갈아끼운다(쌓지 않음) — 입력이 비면 최근 검색어, 2글자 이상이면 자동완성. 일치 부분은 --primary 600.</div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
